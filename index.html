nd": "mc", "qEn": "You can use the Azure File Sync agent to sync on-premises data to an Azure ____.", "qEs": "Puede usar el agente de Azure File Sync para sincronizar datos locales (on-premises) con un/una ____ de Azure.", "oEn": ["blob container", "Data Lake Storage container", "file share", "queue"], "oEs": ["contenedor de blobs", "contenedor de Data Lake Storage", "recurso compartido de archivos", "cola"], "ans": [2], "why": "File Sync trabaja con Azure Files (file shares).", "multi": false, "topic": "Almacenamiento y datos", "dom": "arq", "exp": ["Contenedor de blobs: no es el destino de File Sync.", "Data Lake: no es el destino.", "Recurso compartido de archivos: es el destino de File Sync. Correcta.", "Cola: guarda mensajes."]}, {"n": 148, "kind": "mc", "qEn": "What is the function of a Site-to-Site VPN?", "qEs": "¿Cuál es la función de una VPN de sitio a sitio?", "oEn": ["provides a secure connection between a computer on a public network and the corporate network", "provides a dedicated private connection to Azure that does NOT travel over the internet", "provides a connection from an on-premises VPN device to an Azure VPN gateway"], "oEs": ["proporciona una conexión segura entre un equipo de una red pública y la red corporativa", "proporciona una conexión privada dedicada a Azure que NO viaja por Internet", "proporciona una conexión desde un dispositivo VPN local (on-premises) a una puerta de enlace VPN de Azure"], "ans": [2], "why": "S2S une dos redes (local y Azure). La de equipo individual es punto a sitio; la privada dedicada es ExpressRoute.", "multi": false, "topic": "Redes", "dom": "arq", "exp": ["Conexión de un equipo en red pública a la corporativa: es VPN punto a sitio.", "Conexión privada dedicada sin Internet: es ExpressRoute.", "Dispositivo VPN local a puerta de enlace VPN de Azure: es sitio a sitio. Correcta."]}, {"n": 149, "kind": "match", "qEn": "Match the cloud service models to the appropriate solutions.", "qEs": "Haga coincidir los modelos de servicio en la nube con las soluciones adecuadas.", "rows": [{"en": "Azure App Service", "es": "Azure App Service", "aEn": "PaaS", "aEs": "PaaS"}, {"en": "Azure virtual machines", "es": "Máquinas virtuales de Azure", "aEn": "IaaS", "aEs": "IaaS"}, {"en": "Microsoft Dynamics 365", "es": "Microsoft Dynamics 365", "aEn": "SaaS", "aEs": "SaaS"}], "pool": ["IaaS", "PaaS", "SaaS"], "why": "App Service = PaaS; VM = IaaS; Dynamics 365 = SaaS.", "topic": "Conceptos de nube", "dom": "conc", "exp": ["App Service es PaaS.", "Máquinas virtuales son IaaS.", "Dynamics 365 es SaaS."]}, {"n": 150, "kind": "match", "qEn": "Match the cloud service models to the appropriate solutions.", "qEs": "Haga coincidir los modelos de servicio en la nube con las soluciones adecuadas.", "rows": [{"en": "A cloud-based file server", "es": "Un servidor de archivos basado en la nube", "aEn": "IaaS", "aEs": "IaaS"}, {"en": "A cloud-based accounting system", "es": "Un sistema de contabilidad basado en la nube", "aEn": "SaaS", "aEs": "SaaS"}, {"en": "A cloud-based service for custom apps", "es": "Un servicio basado en la nube para aplicaciones personalizadas", "aEn": "PaaS", "aEs": "PaaS"}], "pool": ["IaaS", "PaaS", "SaaS"], "why": "⚠ El documento marca PaaS / SaaS / IaaS, que parece un error. Lo correcto es IaaS / SaaS / PaaS, que es lo que se muestra aquí. Pregunta al profe.", "disputed": true, "topic": "Conceptos de nube", "dom": "conc", "exp": ["Servidor de archivos en la nube: IaaS.", "Sistema de contabilidad en la nube: SaaS.", "Servicio para aplicaciones personalizadas: PaaS."]}, {"n": 151, "kind": "mc", "qEn": "You need to manage containers.\nWhich two services can you use? Each correct answer presents a complete solution.", "qEs": "Necesita administrar contenedores.\n¿Qué dos servicios puede usar? Cada respuesta correcta presenta una solución completa.", "oEn": ["Azure Virtual Desktop", "Azure virtual machines", "Azure Functions", "Azure Container Instances", "Azure Kubernetes Service (AKS)"], "oEs": ["Azure Virtual Desktop", "Máquinas virtuales de Azure", "Azure Functions", "Azure Container Instances", "Azure Kubernetes Service (AKS)"], "ans": [3, 4], "why": "ACI y AKS son los servicios de contenedores de Azure.", "multi": true, "topic": "Cómputo", "dom": "arq", "exp": ["Virtual Desktop: escritorios virtuales.", "Máquinas virtuales: no gestionan contenedores.", "Functions: serverless.", "Container Instances: ejecuta contenedores. Correcta.", "AKS: orquesta contenedores. Correcta."]}, {"n": 152, "kind": "mc", "qEn": "When you need to delegate permissions to several Azure virtual machines simultaneously, you must deploy the virtual machines ____.", "qEs": "Cuando necesita delegar permisos a varias máquinas virtuales de Azure de forma simultánea, debe implementar las máquinas virtuales ____.", "oEn": ["to the same Azure region", "by using the same Azure Resource Manager template", "to the same resource group", "to the same availability zone"], "oEs": ["en la misma región de Azure", "utilizando la misma plantilla de Azure Resource Manager", "en el mismo grupo de recursos", "en la misma zona de disponibilidad"], "ans": [2], "why": "Los permisos aplicados a un grupo de recursos se heredan por todos sus recursos.", "multi": false, "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["Misma región: no delega permisos.", "Misma plantilla ARM: no delega permisos.", "Mismo grupo de recursos: los permisos se asignan al grupo y se heredan. Correcta.", "Misma zona: no delega permisos."]}, {"n": 153, "kind": "mc", "qEn": "You plan to deploy several Azure virtual machines.\nYou need to ensure that the services running on the virtual machines are available if a single data center fails.\nSolution: You deploy the virtual machines to two or more availability zones.\nDoes this meet the goal?", "qEs": "Planea implementar varias máquinas virtuales de Azure.\nNecesita asegurarse de que los servicios que se ejecutan en las máquinas virtuales estén disponibles si falla un único centro de datos.\nSolución: Implementa las máquinas virtuales en dos o más zonas de disponibilidad.\n¿Esto cumple con el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Cada zona es un centro de datos distinto.", "multi": false, "topic": "Regiones y alta disponibilidad", "dom": "arq", "exp": ["Sí: las zonas son centros de datos distintos. Correcta.", "No: sería incorrecto."]}, {"n": 154, "kind": "mc", "qEn": "This question requires that you evaluate the underlined text to determine if it is correct.\nOne of the benefits of Azure SQL Data Warehouse is that high availability is built into the platform.\nInstructions: Review the underlined text. If it makes the statement correct, select `No change is needed`. If the statement is incorrect, select the answer choice that makes the statement correct.", "qEs": "Esta pregunta requiere que evalúe el texto subrayado para determinar si es correcto.\nUno de los beneficios de Azure SQL Data Warehouse es que la alta disponibilidad está integrada en la plataforma.\nInstrucciones: Revise el texto subrayado. Si hace que la afirmación sea correcta, seleccione `No se necesita ningún cambio`. Si la afirmación es incorrecta, seleccione la opción de respuesta que hace que la afirmación sea correcta.", "oEn": ["No change is needed", "automatic scaling", "data compression", "versioning"], "oEs": ["No se necesita ningún cambio", "escalado automático", "compresión de datos", "control de versiones"], "ans": [0], "why": "La alta disponibilidad viene integrada, así que no hay que cambiar nada.", "multi": false, "topic": "Almacenamiento y datos", "dom": "arq", "exp": ["No se necesita cambio: la alta disponibilidad está integrada. Correcta.", "Escalado automático: no es el beneficio descrito.", "Compresión de datos: no.", "Control de versiones: no."]}, {"n": 155, "kind": "mc", "qEn": "You plan to deploy several Azure virtual machines.\nYou need to ensure that the services running on the virtual machines are available if a single data center fails.\nSolution: You deploy the virtual machines to two or more regions.\nDoes this meet the goal?", "qEs": "Planea implementar varias máquinas virtuales de Azure.\nNecesita asegurarse de que los servicios que se ejecutan en las máquinas virtuales estén disponibles si falla un único centro de datos.\nSolución: Implementa las máquinas virtuales en dos o más regiones.\n¿Esto cumple con el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Regiones distintas son centros de datos distintos.", "multi": false, "topic": "Regiones y alta disponibilidad", "dom": "arq", "exp": ["Sí: varias regiones también sobreviven al fallo de un centro de datos. Correcta.", "No: sería incorrecto."]}, {"n": 156, "kind": "mc", "qEn": "An Azure container instance is an example of an Azure ____.", "qEs": "Una instancia de contenedor de Azure es un ejemplo de un/una ____ de Azure.", "oEn": ["compute service", "identity service", "networking service", "storage service"], "oEs": ["servicio de proceso", "servicio de identidad", "servicio de redes", "servicio de almacenamiento"], "ans": [0], "why": "Los contenedores ejecutan aplicaciones: es cómputo.", "multi": false, "topic": "Cómputo", "dom": "arq", "exp": ["Servicio de cómputo: ejecuta contenedores. Correcta.", "Identidad: no.", "Red: no.", "Almacenamiento: no."]}, {"n": 157, "kind": "mc", "qEn": "At which OSI layer does ExpressRoute operate?", "qEs": "¿En qué capa OSI funciona ExpressRoute?", "oEn": ["Layer 2", "Layer 3", "Layer 5", "Layer 7"], "oEs": ["Capa 2", "Capa 3", "Capa 5", "Capa 7"], "ans": [1], "why": "ExpressRoute es una conexión de capa 3 (enrutamiento, con BGP).", "multi": false, "topic": "Redes", "dom": "arq", "exp": ["Capa 2: no.", "Capa 3 (red): ExpressRoute opera aquí. Correcta.", "Capa 5: no.", "Capa 7: no."]}, {"n": 158, "kind": "mc", "qEn": "Application Insights is a feature of ____.", "qEs": "Application Insights es una característica de ____.", "oEn": ["Azure Advisor", "Azure Application Gateway", "Azure Arc", "Azure Monitor"], "oEs": ["Azure Advisor", "Azure Application Gateway", "Azure Arc", "Azure Monitor"], "ans": [3], "why": "Application Insights forma parte de Azure Monitor.", "multi": false, "topic": "Herramientas y gestión", "dom": "mgmt", "exp": ["Advisor: recomendaciones.", "Application Gateway: balanceador.", "Arc: gestión híbrida.", "Azure Monitor: incluye Application Insights. Correcta."]}, {"n": 159, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, seleccione Sí si la afirmación es verdadera. De lo contrario, seleccione No.", "rows": [{"en": "Azure resources can only access other resources in the same resource group.", "es": "Los recursos de Azure solo pueden acceder a otros recursos del mismo grupo de recursos.", "yes": false}, {"en": "If you delete a resource group, all the resources in it will be deleted.", "es": "Si elimina un grupo de recursos, se eliminarán todos los recursos que contiene.", "yes": true}, {"en": "A resource group can contain resources from multiple Azure regions.", "es": "Un grupo de recursos puede contener recursos de varias regiones de Azure.", "yes": true}], "why": "Un grupo de recursos es solo un contenedor lógico.", "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["Los recursos pueden acceder a otros de distintos grupos. No.", "Al eliminar un grupo se eliminan sus recursos. Sí.", "Un grupo puede tener recursos de varias regiones. Sí."]}, {"n": 160, "kind": "mc", "qEn": "You plan to store 20 TB of data in Azure. The data will be accessed infrequently and visualized by using Microsoft Power BI.\nYou need to recommend a storage solution for the data.\nWhich two solutions should you recommend? Each correct answer presents a complete solution.", "qEs": "Planea almacenar 20 TB de datos en Azure. Se accederá a los datos con poca frecuencia y se visualizarán mediante Microsoft Power BI.\nNecesita recomendar una solución de almacenamiento para los datos.\n¿Qué dos soluciones debe recomendar? Cada respuesta correcta presenta una solución completa.", "oEn": ["Azure Data Lake", "Azure Cosmos DB", "Azure SQL Data Warehouse", "Azure SQL Database", "Azure Database for PostgreSQL"], "oEs": ["Azure Data Lake", "Azure Cosmos DB", "Azure SQL Data Warehouse", "Azure SQL Database", "Azure Database for PostgreSQL"], "ans": [0, 2], "why": "Data Lake y SQL Data Warehouse sirven para grandes volúmenes y analítica con Power BI.", "multi": true, "topic": "Almacenamiento y datos", "dom": "arq", "exp": ["Data Lake: datos poco accedidos y analizables en Power BI. Correcta.", "Cosmos DB: para acceso frecuente y baja latencia.", "SQL Data Warehouse: almacén analítico para Power BI. Correcta.", "SQL Database: transaccional.", "PostgreSQL: transaccional."]}, {"n": 161, "kind": "mc", "qEn": "You have an Azure environment that contains 10 web apps. To which URL should you connect to manage all the Azure resources? (options rebuilt from the dropdown pieces)", "qEs": "Tiene un entorno de Azure que contiene 10 aplicaciones web. ¿A qué URL debe conectarse para administrar todos los recursos de Azure? (opciones reconstruidas a partir de las piezas del menú desplegable)", "oEn": ["https://admin.azure.com", "https://portal.azure.com", "https://www.microsoft.com", "https://portal.azurewebsites.com"], "oEs": ["https://admin.azure.com", "https://portal.azure.com", "https://www.microsoft.com", "https://portal.azurewebsites.com"], "ans": [1], "why": "El portal de Azure está en https://portal.azure.com.", "multi": false, "topic": "Herramientas y gestión", "dom": "mgmt", "exp": ["admin.azure.com: no es el portal de gestión.", "portal.azure.com: portal de Azure. Correcta.", "microsoft.com: web general.", "portal.azurewebsites.com: no existe como portal."]}, {"n": 162, "kind": "match", "qEn": "Arrange the storage account redundancy options from the least redundant to the most redundant.", "qEs": "Ordene las opciones de redundancia de la cuenta de almacenamiento de la menos redundante a la más redundante.", "rows": [{"en": "1st (least redundant)", "es": "1.º (la menos redundante)", "aEn": "LRS", "aEs": "LRS (almacenamiento con redundancia local)"}, {"en": "2nd", "es": "2.º", "aEn": "ZRS", "aEs": "ZRS (redundancia de zona)"}, {"en": "3rd (most redundant)", "es": "3.º (la más redundante)", "aEn": "GRS", "aEs": "GRS (redundancia geográfica)"}], "pool": ["LRS", "ZRS", "GRS"], "why": "LRS copia en un centro de datos; ZRS en 3 zonas; GRS en otra región.", "topic": "Almacenamiento y datos", "dom": "arq", "exp": ["LRS es la menos redundante (copias en un centro de datos).", "ZRS replica entre zonas.", "GRS replica a otra región, la más redundante de las tres."]}, {"n": 163, "kind": "mc", "qEn": "Azure Blob Storage is a ____.", "qEs": "Azure Blob Storage es un ____.", "oEn": ["data store for queuing and reliably delivering messages between applications", "file share that can be mapped as a network drive", "key/attribute store for non-relational structured data", "storage service optimized for very large objects, such as video files and bitmaps"], "oEs": ["almacén de datos para poner en cola y entregar de forma confiable mensajes entre aplicaciones", "recurso compartido de archivos que se puede asignar como unidad de red", "almacén de clave/atributo para datos estructurados no relacionales", "servicio de almacenamiento optimizado para objetos muy grandes, como archivos de vídeo y mapas de bits"], "ans": [3], "why": "Blob = objetos grandes. Colas = mensajes; Files = unidad de red; Tables = clave/atributo.", "multi": false, "topic": "Almacenamiento y datos", "dom": "arq", "exp": ["Colas de mensajes: Queue Storage.", "Recurso compartido mapeable: Azure Files.", "Clave/atributo: Table Storage.", "Blob: objetos grandes como vídeos e imágenes. Correcta."]}, {"n": 164, "kind": "mc", "qEn": "An Azure administrator plans to run a PowerShell script that creates Azure resources.\nYou need to recommend which computer configuration to use to run the script.\nSolution: Run the script from a computer that runs Linux and has the Azure CLI tools installed.\nDoes this meet the goal?", "qEs": "Un administrador de Azure planea ejecutar un script de PowerShell que crea recursos de Azure.\nNecesita recomendar qué configuración de equipo usar para ejecutar el script.\nSolución: Ejecute el script desde un equipo que ejecuta Linux y tiene instaladas las herramientas de la CLI de Azure.\n¿La solución cumple con el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Azure CLI no ejecuta scripts de PowerShell. Haría falta PowerShell o el módulo de Azure PowerShell.", "multi": false, "topic": "Herramientas y gestión", "dom": "mgmt", "exp": ["Sí: sería incorrecto.", "No: Azure CLI en Linux sirve, pero el script es de PowerShell, así que no cumple. Correcta."]}, {"n": 165, "kind": "mc", "qEn": "An Azure administrator plans to run a PowerShell script that creates Azure resources.\nYou need to recommend which computer configuration to use to run the script.\nSolution: Run the script from a computer that runs Chrome OS and uses Azure Cloud Shell.\nDoes this meet the goal?", "qEs": "Un administrador de Azure planea ejecutar un script de PowerShell que crea recursos de Azure.\nNecesita recomendar qué configuración de equipo usar para ejecutar el script.\nSolución: Ejecute el script desde un equipo que ejecuta Chrome OS y utiliza Azure Cloud Shell.\n¿La solución cumple con el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Cloud Shell funciona desde el navegador y ofrece PowerShell.", "multi": false, "topic": "Herramientas y gestión", "dom": "mgmt", "exp": ["Sí: Cloud Shell ejecuta PowerShell desde cualquier navegador. Correcta.", "No: sería incorrecto."]}, {"n": 166, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, seleccione Sí si la afirmac jetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "El portal de Azure funciona en cualquier navegador.", "multi": false, "topic": "Herramientas y gestión", "dom": "mgmt", "exp": ["Sí: el portal de Azure funciona desde el navegador y permite crear VM. Correcta.", "No: sería incorrecto."]}, {"n": 209, "kind": "mc", "qEn": "____ provides in-depth information about security, privacy, compliance offerings, policies, and features across Microsoft cloud products.", "qEs": "____ proporciona información detallada sobre seguridad, privacidad, ofertas de cumplimiento, políticas y características en los productos de la nube de Microsoft.", "oEn": ["The Microsoft 365 Compliance admin center", "The Microsoft 365 Defender portal", "Microsoft Defender for Cloud in the Azure portal", "Microsoft Trust Center"], "oEs": ["El centro de administración de Microsoft 365 Compliance", "El portal de Microsoft 365 Defender", "Microsoft Defender for Cloud en Azure portal", "Microsoft Trust Center"], "ans": [3], "why": "El Trust Center es el sitio público con información de seguridad, privacidad y cumplimiento de los productos de Microsoft.", "multi": false, "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["Centro de administración de cumplimiento de Microsoft 365: gestiona el cumplimiento de Microsoft 365, no informa de las ofertas de la nube de Microsoft.", "Portal de Microsoft 365 Defender: es para seguridad de Microsoft 365.", "Defender for Cloud: evalúa la seguridad de tus recursos, no es un centro de información.", "Microsoft Trust Center: publica información detallada sobre seguridad, privacidad y cumplimiento. Correcta."]}, {"n": 210, "kind": "mc", "qEn": "You can manage an on-premises Windows server as an Azure resource by using ____.", "qEs": "Puede administrar un servidor Windows local (on-premises) como un recurso de Azure mediante ____.", "oEn": ["Azure AD Connect.", "Azure Arc.", "an Azure Pipelines agent.", "Azure VPN Gateway."], "oEs": ["Azure AD C njunto de herramientas de control de versiones para administrar el código?", "oEn": ["Azure Repos", "Azure DevTest Labs", "Azure Storage", "Azure Cosmos DB"], "oEs": ["Azure Repos", "Azure DevTest Labs", "Azure Storage", "Azure Cosmos DB"], "ans": [0], "why": "Azure Repos (parte de Azure DevOps) ofrece repositorios Git y control de versiones.", "multi": false, "topic": "Herramientas y gestión", "dom": "mgmt", "exp": ["Azure Repos: control de versiones para código (Git). Correcta.", "DevTest Labs: crea entornos de prueba.", "Azure Storage: almacena datos.", "Cosmos DB: base de datos."]}, {"n": 215, "kind": "mc", "qEn": "You need to manage Azure by using Azure Cloud Shell. Which Azure portal icon should you select? (the icons of the portal top bar are described below)", "qEs": "Necesita administrar Azure mediante Azure Cloud Shell. ¿Qué icono de Azure portal debe seleccionar? (los iconos de la barra superior del portal se describen a continuación)", "oEn": ["The Cloud Shell icon (>_)", "The Directory + subscription filter icon", "The Notifications icon (bell)", "The Settings icon (gear)", "The Help icon (?)", "The Feedback icon (smiley face)"], "oEs": ["El icono de Cloud Shell (>_)", "El icono del filtro de directorio + suscripción", "El icono de notificaciones (campana)", "El icono de configuración (engranaje)", "El icono de ayuda (?)", "El icono de comentarios (cara sonriente)"], "ans": [0], "why": "El icono >_ de la barra superior abre Azure Cloud Shell (Bash o PowerShell en el navegador).", "multi": false, "topic": "Herramientas y gestión", "dom": "mgmt", "exp": ["Icono de Cloud Shell (>_): abre Cloud Shell. Correcta.", "Directorio + suscripción: cambia de directorio o filtra suscripciones.", "Notificaciones: muestra avisos.", "Configuración: ajustes del portal.", "Ayuda: ayuda y soporte.", "Comentarios: enviar opiniones a Microsoft."]}, {"n": 216, "kind": "mc", "qEn": "You have a virtual machine named VM1 that runs Windows Server 2016. VM1 is in the East US Azure region.\nWhich Azure service should you use from the Azure portal to view service failure notifications that can affect the availability of VM1?", "qEs": "Tiene una máquina virtual denominada VM1 que ejecuta Windows Server 2016. VM1 está en la región East US de Azure.\n¿Qué servicio de Azure debe utilizar desde Azure portal para ver las notificaciones de errores del servicio que pueden afectar a la disponibilidad de VM1?", "oEn": ["Azure Service Fabric", "Azure Monitor", "Azure virtual machines", "Azure Advisor"], "oEs": ["Azure Service Fabric", "Azure Monitor", "Máquinas virtuales de Azure", "Azure Advisor"], "ans": [1], "why": "La clave marca Azure Monitor (el estado del servicio se ve desde Monitor).", "multi": false, "topic": "Herramientas y gestión", "dom": "mgmt", "exp": ["Service Fabric: plataforma de microservicios, no avisa de fallos.", "Azure Monitor: incluye Service Health, que muestra incidencias que afectan a tus recursos. Correcta.", "Virtual Machines: es el servicio de VM, no muestra notificaciones de fallos.", "Advisor: da recomendaciones, no avisa de fallos del servicio."]}, {"n": 217, "kind": "mc", "qEn": "Your Azure environment contains multiple Azure virtual machines.\nYou need to ensure that a virtual machine named VM1 is accessible from the Internet over HTTP.\nSolution: You modify an Azure Traffic Manager profile.\nDoes this meet the goal?", "qEs": "Su entorno de Azure contiene varias máquinas virtuales de Azure.\nNecesita asegurarse de que se pueda acceder a una máquina virtual denominada VM1 desde Internet a través de HTTP.\nSolución: Modifica un perfil de Azure Traffic Manager.\n¿La solución cumple con el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Traffic Manager reparte tráfico por DNS, no abre puertos de una VM; hay que modificar el NSG.", "multi": false, "topic": "Redes", "dom": "arq", "exp": ["Sí: sería incorrecto.", "No: Traffic Manager es un balanceador DNS y no abre el acceso HTTP a una VM concreta. Correcta."]}, {"n": 218, "kind": "mc", "qEn": "Your company plans to deploy several web servers and several database servers to Azure.\nYou need to recommend an Azure solution to limit the types of connections from the web servers to the database servers.\nWhat should you include in the recommendation?", "qEs": "Su empresa planea implementar varios servidores web y varios servidores de bases de datos en Azure.\nNecesita recomendar una solución de Azure para limitar los tipos de conexiones de los servidores web a los servidores de bases de datos.\n¿Qué debe incluir en la recomendación?", "oEn": ["network security groups (NSGs)", "Azure Service Bus", "a local network gateway", "a route filter"], "oEs": ["grupos de seguridad de red (NSG)", "Azure Service Bus", "una puerta de enlace de red local", "un filtro de rutas"], "ans": [0], "why": "Los NSG filtran el tráfico entre recursos por origen, destino, puerto y protocolo.", "multi": false, "topic": "Redes", "dom": "arq", "exp": ["NSG: filtra el tráfico por puerto, origen y destino, ideal para limitar conexiones entre servidores. Correcta.", "Service Bus: mensajería entre aplicaciones.", "Local network gateway: representa una red local en una VPN.", "Route filter: filtra rutas BGP de ExpressRoute."]}, {"n": 219, "kind": "mc", "qEn": "From ____ you can view which user turned off a specific virtual machine during the last 14 days.", "qEs": "Desde ____ puede ver qué usuario apagó una máquina virtual específica durante los últimos 14 días.", "oEn": ["Azure Access Control IAM", "Azure Event Hubs", "Azure Activity Log", "Azure Service Health"], "oEs": ["Azure Access Control IAM", "Azure Event Hubs", "Azure Activity Log", "Azure Service Health"], "ans": [2], "why": "El registro de actividad guarda 90 días de operaciones: quién hizo qué y cuándo.", "multi": false, "topic": "Herramientas y gestión", "dom": "mgmt", "exp": ["Access control (IAM): gestiona permisos, no muestra quién apagó una VM.", "Event Hubs: ingiere flujos de event egistros de Windows Defender Firewall."]}, {"n": 224, "kind": "match", "qEn": "Match the Azure services to the correct descriptions.", "qEs": "Haga coincidir los servicios de Azure con las descripciones correctas.", "rows": [{"en": "Analyze security log files from Azure virtual machines", "es": "Analizar los archivos de registro de seguridad de las máquinas virtuales de Azure", "aEn": "Azure Sentinel", "aEs": "Azure Sentinel"}, {"en": "Display the secure score for an Azure subscription", "es": "Mostrar la puntuación de seguridad de una suscripción de Azure", "aEn": "Azure Security Center", "aEs": "Azure Security Center"}, {"en": "Store passwords for use by Azure Function applications", "es": "Almacenar contraseñas para que las utilicen las aplicaciones de Azure Function", "aEn": "Azure Key Vault", "aEs": "Azure Key Vault"}], "pool": ["Azure Active Directory (Azure AD)", "Azure Key Vault", "Azure Lighthouse", "Azure Security Center", "Azure Sentinel"], "why": "Sentinel = SIEM; Security Center = secure score; Key Vault = secretos y contraseñas.", "topic": "Identidad y seguridad", "dom": "arq", "exp": ["Azure Sentinel: analiza registros de seguridad (SIEM).", "Security Center: muestra la puntuación de seguridad (secure score).", "Key Vault: guarda contraseñas y secretos para aplicaciones."]}, {"n": 225, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, seleccione Sí si la afirmación es verdadera. De lo contrario, seleccione No.", "rows": [{"en": "Azure Firewall will encrypt all the network traffic sent from Azure to the Internet.", "es": "Azure Firewall cifrará todo el tráfico de red enviado desde Azure a Internet.", "yes": false}, {"en": "A network security group (NSG) will encrypt all the network traffic sent from Azure to the Internet.", "es": "Un grupo de seguridad de red (NSG) cifrará todo el tráfico de red enviado desde Azure a Internet.", "yes": false}, {"en": "Azure virtual machi os de MFA (sí lo son Authenticator, SMS o llamada de voz).", "Sí: se puede exigir solo a administradores o a cualquier cuenta de usuario."]}, {"n": 271, "kind": "mc", "qEn": "You need to ensure that when Azure Active Directory (Azure AD) users connect to Azure AD from the Internet by using an anonymous IP address, the users are prompted automatically to change their password.\nWhich Azure service should you use?", "qEs": "Necesita asegurarse de que cuando los usuarios de Azure Active Directory (Azure AD) se conecten a Azure AD desde Internet mediante una dirección IP anónima, se les pida automáticamente que cambien su contraseña.\n¿Qué servicio de Azure debe utilizar?", "oEn": ["Azure AD Connect Health", "Azure AD Privileged Identity Management", "Azure Advanced Threat Protection (ATP)", "Azure AD Identity Protection"], "oEs": ["Azure AD Connect Health", "Azure AD Privileged Identity Management", "Azure Advanced Threat Protection (ATP)", "Azure AD Identity Protection"], "ans": [3], "why": "Identity Protection detecta inicios de sesión de riesgo (IP anónima) y aplica directivas como el cambio de contraseña.", "multi": false, "topic": "Identidad y seguridad", "dom": "arq", "exp": ["Connect Health: supervisa la sincronización híbrida.", "PIM: gestiona el acceso privilegiado.", "ATP: detecta amenazas en AD local.", "Azure AD Identity Protection (hoy Microsoft Entra ID Protection): directivas de riesgo de inicio de sesión. Correcta."]}, {"n": 272, "kind": "match", "qEn": "Match the term to the correct definition.\nInstructions: To answer, drag the appropriate term from the column on the left to its description on the right. Each term may be used once, more than once, or not at all.\nNOTE: Each correct match is worth one point.", "qEs": "Haga coincidir el término con la definición correcta.\nInstrucciones: Para responder, arrastre el término adecuado de la columna izquierda a su descripción a la derecha. Cada término se puede usar una vez, más de una vez o ninguna.\nNOTA: Cada coincidencia correcta vale un punto.", "rows": [{"en": "An organization that defines international standards across all industries.", "es": "Una organización que define estándares internacionales en todos los sectores.", "aEn": "ISO", "aEs": "ISO"}, {"en": "An organization that defines standards used by the United States government.", "es": "Una organización que define estándares utilizados por el gobierno de Estados Unidos.", "aEn": "NIST", "aEs": "NIST"}, {"en": "A European policy that regulates data privacy and data protection.", "es": "Una política europea que regula la privacidad y la protección de datos.", "aEn": "GDPR", "aEs": "GDPR"}, {"en": "A dedicated public cloud for federal and state agencies in the United States.", "es": "Una nube pública dedicada para agencias federales y estatales de Estados Unidos.", "aEn": "Azure Government", "aEs": "Azure Government"}], "pool": ["Azure Government", "GDPR", "ISO", "NIST"], "why": "ISO = estándares internacionales; NIST = EE. UU.; GDPR = privacidad en la UE; Azure Government = nube para el gobierno de EE. UU.", "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["ISO: Organización Internacional de Normalización.", "NIST: Instituto Nacional de Estándares y Tecnología de EE. UU.", "GDPR: reglamento europeo de protección de datos.", "Azure Government: nube dedicada a agencias federales y estatales de EE. UU."]}, {"n": 273, "kind": "mc", "qEn": "To what should an application connect to retrieve security tokens?", "qEs": "¿A qué debe conectarse una aplicación para recuperar tokens de seguridad?", "oEn": ["an Azure Storage account", "Azure Active Directory (Azure AD)", "a certificate store", "an Azure key vault"], "oEs": ["una cuenta de Azure Storage", "Azure Active Directory (Azure AD)", "un almacén de certificados", "un almacén de claves de Azure (Key Vault)"], "ans": [1], "why": "Los tokens de seguridad los emite Azure AD (hoy Microsoft Entra ID); la comunidad estuvo dividida con Key Vault.", "multi": fals y": "Un bloqueo (Locks) impide eliminar o modificar recursos accidentalmente.", "multi": false, "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["Quickstart: guía de inicio.", "Resource costs: muestra costes.", "Deployments: historial de implementaciones.", "Policies: aplican reglas de cumplimiento, no impiden eliminar.", "Properties: información del grupo.", "Locks: bloqueo CanNotDelete o ReadOnly contra eliminación accidental. Correcta.", "Export template: exporta plantilla ARM."]}, {"n": 277, "kind": "mc", "qEn": "You have a resource group named RG1.\nYou need to prevent the creation of virtual machines in RG1. The solution must ensure that other objects can be created in RG1.\nWhat should you use?", "qEs": "Tiene un grupo de recursos denominado RG1.\nNecesita impedir la creación de máquinas virtuales en RG1. La solución debe garantizar que se puedan crear otros objetos en RG1.\n¿Qué debe utilizar?", "oEn": ["a lock", "an Azure role", "a tag", "an Azure policy"], "oEs": ["un bloqueo", "un rol de Azure", "una etiqueta", "una directiva de Azure"], "ans": [3], "why": "Azure Policy puede denegar un tipo de recurso concreto (VM) sin bloquear el resto.", "multi": false, "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["Bloqueo: impediría eliminar/modificar todo, no solo VM.", "Rol de Azure: concede permisos a usuarios, no restringe tipos de recurso.", "Etiqueta: solo metadatos.", "Directiva de Azure (tipos de recurso no permitidos): deniega crear VM. Correcta."]}, {"n": 278, "kind": "mc", "qEn": "You have an Azure subscription and 100 Windows 10 devices.\nYou need to ensure that only users whose devices have the latest security patches installed can access Azure Active Directory (Azure AD)-integrated applications.\nWhat should you implement?", "qEs": "Tiene una suscripción de Azure y 100 dispositivos con Windows 10.\nNecesita asegurarse de que solo los usuarios cuyos dispositivos tengan instaladas las últimas revisiones de seguridad puedan acceder a .", "Centro de cumplimiento de Microsoft 365: gestiona cumplimiento de datos de M365, no los informes de auditoría de Azure.", "Service Trust Portal: también publica informes de auditoría, pero la clave marca Defender for Cloud."]}, {"n": 292, "kind": "yn", "qEn": "For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.", "qEs": "Para cada una de las siguientes afirmaciones, seleccione Sí si la afirmación es verdadera. De lo contrario, seleccione No.\nNOTA: Cada selección correcta vale un punto.", "rows": [{"en": "The Microsoft Service Trust Portal can be accessed by using a Microsoft cloud services account.", "es": "Se puede acceder al Portal de confianza de servicios de Microsoft con una cuenta de servicios en la nube de Microsoft.", "yes": true}, {"en": "Compliance Manager can be used to track your company's regulatory compliance activities related to Microsoft cloud services.", "es": "Compliance Manager se puede usar para realizar un seguimiento de las actividades de cumplimiento normativo de su empresa relacionadas con los servicios en la nube de Microsoft.", "yes": true}, {"en": "The My Library feature can be used to save Microsoft Service Trust Portal documents and resources in a single location.", "es": "La característica Mi biblioteca (My Library) se puede usar para guardar documentos y recursos del Portal de confianza de servicios de Microsoft en un solo lugar.", "yes": true}], "why": "Las tres afirmaciones son verdaderas sobre Service Trust Portal.", "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["Se accede con una cuenta de Microsoft cloud services (organizativa). Sí.", "Compliance Manager hace seguimiento de actividades de cumplimiento. Sí.", "My Library guarda documentos y recursos en un solo lugar. Sí."]}, {"n": 293, "kind": "mc", "qEn": "Your company has an Azure subscription that contains resources in several regions.\nYou need to create the Azure  Partner Portal", "Compliance Manager", "el Trust Center"], "ans": [2], "why": "Compliance Manager permite seguir estándares como ISO 27001; Cloud Shell es solo una consola.", "multi": false, "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["Cloud Shell es una consola de línea de comandos, no sirve para seguimiento de cumplimiento.", "Cloud Partner Portal: es para socios, no para cumplimiento.", "Compliance Manager: evalúa y sigue el cumplimiento de estándares como ISO 27001. Correcta.", "Trust Center: ofrece información de cumplimiento pero no hace seguimiento de su empresa (la comunidad discrepa en parte)."]}, {"n": 295, "kind": "yn", "qEn": "For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.", "qEs": "Para cada una de las siguientes afirmaciones, seleccione Sí si la afirmación es verdadera. De lo contrario, seleccione No.\nNOTA: Cada selección correcta vale un punto.", "rows": [{"en": "You can create Group Polices in Azure Active Directory (Azure AD).", "es": "Puede crear directivas de grupo en Azure Active Directory (Azure AD).", "yes": false}, {"en": "You can join Windows 10 devices to Azure Active Directory (Azure AD).", "es": "Puede unir dispositivos Windows 10 a Azure Active Directory (Azure AD).", "yes": true}, {"en": "You can join Android devices to Azure Active Directory (Azure AD).", "es": "Puede unir dispositivos Android a Azure Active Directory (Azure AD).", "yes": false}], "why": "Azure AD no tiene directivas de grupo y solo une dispositivos Windows.", "topic": "Identidad y seguridad", "dom": "arq", "exp": ["Las directivas de grupo son de AD DS local; Azure AD no las tiene. No.", "Windows 10 se puede unir a Azure AD (hoy Microsoft Entra ID). Sí.", "Android se puede registrar, pero no unir a Azure AD. No."]}, {"n": 296, "kind": "mc", "qEn": "The ____ explains what data Microsoft processes, how Microsoft processes the data, and the purpose of processing the data.", "qEs": "El/La ____ explica qué datos procesa Microsoft, cómo los procesa y con qué finalidad.", "oEn": ["Microsoft Online Services Privacy Statement", "Microsoft Product Terms", "Microsoft Online Service Level Agreement", "Online Subscription Agreement for Microsoft Azure"], "oEs": ["Declaración de privacidad de Microsoft Online Services", "Términos del producto de Microsoft", "Contrato de nivel de servicio de Microsoft Online", "Contrato de suscripción en línea de Microsoft Azure"], "ans": [0], "why": "La declaración de privacidad detalla qué datos se procesan, cómo y para qué.", "multi": false, "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["Declaración de privacidad: explica qué datos personales se procesan, cómo y su finalidad. Correcta.", "Términos del producto: condiciones de licencia, no privacidad.", "SLA: garantiza disponibilidad, no explica el procesamiento de datos.", "Contrato de suscripción: términos contractuales generales."]}, {"n": 297, "kind": "mc", "qEn": "____ is the process of verifying a user's credentials.", "qEs": "____ es el proceso de verificar las credenciales de un usuario.", "oEn": ["Authorization", "Authentication", "Federation", "Ticketing"], "oEs": ["Autorización", "Autenticación", "Federación", "Emisión de tickets"], "ans": [1], "why": "Autenticar es demostrar quién eres; autorizar es qué puedes hacer.", "multi": false, "topic": "Identidad y seguridad", "dom": "arq", "exp": ["Autorización: define a qué puede acceder el usuario ya autenticado.", "Autenticación: verifica las credenciales del usuario. Correcta.", "Federación: relación de confianza entre dominios.", "Ticketing: no es el proceso de verificación de credenciales."]}, {"n": 298, "kind": "mc", "qEn": "An Azure Policy initiative definition is a ____", "qEs": "Una definición de iniciativa de Azure Policy es una ____", "oEn": ["collection of policy definitions", "collection of Azure Policy definition assignments", "group of Azure Blueprints definition unto de servicios. Sí.", "La cuenta gratuita caduca (crédito 30 días / 12 meses). Sí.", "Solo se permite una cuenta gratuita por persona. No."]}, {"n": 341, "kind": "mc", "qEn": "You have an Azure application that uses the services shown in the following table.\nAzure virtual machines: 99.9%\nAzure SQL Database: 99.99%\nHow should you calculate the composite SLA for the application?", "qEs": "Tiene una aplicación de Azure que usa los servicios que se muestran en la siguiente tabla.\nAzure virtual machines: 99,9 %\nAzure SQL Database: 99,99 %\n¿Cómo debe calcular el SLA compuesto de la aplicación?", "oEn": ["0.999 * 0.9999 = 0.9989001 = 99.89001%", "0.999 / 0.9999 = 0.9991 = 99.91%", "Max(0.999, 0.9999) = 0.9999 = 99.99%", "Min(0.999, 0.9999) = 0.999 = 99.9%"], "oEs": ["0,999 * 0,9999 = 0,9989001 = 99,89001 %", "0,999 / 0,9999 = 0,9991 = 99,91 %", "Max(0,999, 0,9999) = 0,9999 = 99,99 %", "Min(0,999, 0,9999) = 0,999 = 99,9 %"], "ans": [0], "why": "El SLA compuesto es el producto de los SLA individuales.", "multi": false, "topic": "Costes y soporte", "dom": "mgmt", "exp": ["Se multiplican los SLA. Correcta.", "No se dividen.", "No se toma el máximo.", "No se toma el mínimo."]}, {"n": 342, "kind": "mc", "qEn": "____ provide access to unused Azure compute capacity at deep discounts.", "qEs": "____ proporcionan acceso a la capacidad de cómputo de Azure sin usar con grandes descuentos.", "oEn": ["Azure Container Instances", "Azure Reserved Virtual Machine Instances", "Azure Spot virtual machine instances", "Azure virtual machine scale sets"], "oEs": ["Azure Container Instances", "Instancias de máquina virtual reservadas de Azure", "Instancias de máquina virtual de acceso puntual (Spot) de Azure", "Conjuntos de escalado de máquinas virtuales de Azure"], "ans": [2], "why": "Las VM Spot usan capacidad sobrante con grandes descuentos.", "multi": false, "topic": "Cómputo", "dom": "arq", "exp": ["Container Instances ejecuta contenedores sin servidor.", "Las reservadas dan descue function qCols(d){const lang=st.lang;return `<div class="${lang==='both'?'cols':'cols one'}" id="tcols">${(lang!=='en'?tside(d,'es',true):'')+(lang!=='es'?tside(d,'en',true):'')}</div>`}
function getAns(d,root){
  if(d.kind==='mc')return [...root.querySelectorAll('input[name=o]:checked')].map(x=>+x.value).sort((a,b)=>a-b);
  if(d.kind==='yn')return d.rows.map((r,j)=>{const c=root.querySelector(`input[name=r${j}]:checked`);return c?c.value==='1':null});
  return d.rows.map((r,j)=>{const v=root.querySelector(`select[name=m${j}]`).value;return v===''?null:d.pool[+v]});
}
function setAns(d,a,root){
  if(!a)return;
  if(d.kind==='mc')a.forEach(i=>root.querySelectorAll('input[name=o]').forEach(x=>{if(+x.value===i)x.checked=true}));
  else if(d.kind==='yn')a.forEach((v,j)=>{if(v!==null)root.querySelectorAll(`input[name=r${j}]`).forEach(x=>{if(x.value===(v?'1':'0'))x.checked=true})});
  else a.forEach((v,j)=>{if(v!==null)root.querySelectorAll(`select[name=m${j}]`).forEach(s=>s.value=String(d.pool.indexOf(v)))});
}
const answered=(d,a)=>!a?false:d.kind==='mc'?a.length>0:a.some(x=>x!==null);
function isRight(d,a){
  if(!a)return false;
  if(d.kind==='mc'){const c=[...d.ans].sort((x,y)=>x-y);return a.length===c.length&&a.every((x,i)=>x===c[i])}
  if(d.kind==='yn')return a.every((x,j)=>x===d.rows[j].yes);
  return a.every((x,j)=>x===d.rows[j].aEn);
}
function answerCols(d){const lang=st.lang;return `<div class="${lang==='both'?'cols':'cols one'}">${(lang!=='en'?side(d,'es',true):'')+(lang!=='es'?side(d,'en',true):'')}</div>`}
const INT=[0,0,1,3,7,14];
function srsUpdate(n,ok){
  const e=srs[n]||{b:0,a:0,c:0,due:0};e.a++;
  if(ok){e.c++;e.b=Math.min(5,e.b?e.b+1:2)}else e.b=1;
  e.due=Date.now()+INT[e.b]*864e5;srs[n]=e;
}
const dueNow=()=>DATA.filter(d=>srs[d.n]&&srs[d.n].due<=Date.now());
function fmtTime(s){return Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s'}
function resultView(root,res,meta){

  const bars=o=>Object.entries(o).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([k,v])=>{const p=Math.round(v.c/v.n*100);return `<div class="brow"><span>${esc(DOMN[k]||k)}</span><div class="tr"><u class="${p<70?'low':''}" style="width:${p}%"></u></div><small>${v.c}/${v.n} · ${p} %</small></div>`}).join('');

  ${meta.exam?`<h3 class="h2" style="margin-top:16px;font-size:16px">Por dominio</h3>${bars(byD)}`:''}

}
function recordResults(res,meta,applySrs){
  res.forEach(r=>{if(applySrs)srsUpdate(r.d.n,r.ok);r.ok?wrong.delete(r.d.n):wrong.add(r.d.n)});

const T={q:[],i:0,res:[],exam:false,t0:0,timer:null,checked:false,done:true};
const tv=$('#test');
function poolFor(src,topic,incDup){
  let p=DATA.filter(d=>(incDup||!d.dupOf)&&(topic==='all'||d.topic===topic));
  if(src==='wrong')p=p.filter(d=>wrong.has(d.n));
  else if(src==='done')p=p.filter(d=>done.has(d.n));
  else if(src==='new')p=p.filter(d=>!done.has(d.n));
  else if(src==='disp')p=p.filter(d=>d.disputed);
  else if(src==='fav')p=p.filter(d=>favs.has(d.n));
  return p;
}
function smartOrder(p){
  const now=Date.now();
  const due=p.filter(d=>srs[d.n]&&srs[d.n].due<=now).sort((a,b)=>srs[a.n].b-srs[b.n].b||Math.random()-.5);
  const unseen=shuffle(p.filter(d=>!srs[d.n]));
  const later=p.filter(d=>srs[d.n]&&srs[d.n].due>now).sort((a,b)=>srs[a.n].due-srs[b.n].due);
  return [...due,...unseen,...later];
}

function tick(){const c=$('#clock');if(!c)return;const s=Math.floor((Date.now()-T.t0)/1000);c.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function showQ(){

function finishTest(){

function beginTest(pool){T.q=pool;T.i=0;T.res=[];T.t0=Date.now();clearInterval(T.timer);T.timer=setInterval(tick,1000);showQ()}
tv.addEventListener('click',e=>{
  const id=(e.target.closest('button')||{}).id;

  }else if(id==='tquit'){clearInterval(T.timer);setup()}

const X={q:[],ans:[],flag:new Set(),i:0,t0:0,limit:45*60,timer:null,active:false};
const xv=$('#exam');
function examHome(msg){
  clearInterval(X.timer);X.active=false;
  xv.innerHTML=`<div class="card"><h2 class="h2">Examen simulado</h2>
  <p class="pool" style="margin:0">45 preguntas en 45 minutos, con la mezcla de dominios del examen real: 13 de conceptos de nube, 17 de arquitectura y servicios y 15 de gestión y gobierno. No ves la solución hasta el final. Puedes volver atrás, marcar preguntas para revisar y saltar con el mapa de números. Se aprueba con el 70 %.</p>

  $('#xl').value=st.lang;

function buildExam(inc){
  const want={conc:13,arq:17,mgmt:15};
  const pool=DATA.filter(d=>inc||!d.dupOf);
  let out=[];
  for(const k in want)out.push(...shuffle(pool.filter(d=>d.dom===k)).slice(0,want[k]));
  if(out.length<45){const ids=new Set(out.map(d=>d.n));out.push(...shuffle(pool.filter(d=>!ids.has(d.n))).slice(0,45-out.length))}
  return shuffle(out);
}
function xClock(){
  const left=Math.max(0,X.limit-Math.floor((Date.now()-X.t0)/1000));
  const c=$('#xclock');if(c){c.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');c.classList.toggle('low',left<300)}
  if(left<=0&&X.active)xFinish(true);
}
function xSave(){const d=X.q[X.i];if(d&&$('#xq'))X.ans[X.i]=getAns(d,$('#xq'))}
function xShow(){
  const d=X.q[X.i];
  const grid=X.q.map((q,j)=>`<button class="qn ${answered(q,X.ans[j])?'ans':''} ${X.flag.has(j)?'flag':''} ${j===X.i?'cur':''}" data-go="${j}">${j+1}</button>`).join('');

  <div class="foot"><button class="btn" id="xprev" ${X.i===0?'disabled':''}>← Anterior</button><button class="show" id="xnext">${X.i+1>=X.q.length?'Revisar y terminar':'Siguiente →'}</button><button class="btn" id="xflag">${X.flag.has(X.i)?'Quitar marca':'Marcar para revisar'}</button><button class="btn danger" id="xend">Terminar examen</button></div>
  <div class="grid" id="xgrid">${grid}</div><p class="pool">Azul = contestada · borde amarillo = marcada para revisar.</p></div>`;
  setAns(d,X.ans[X.i],$('#xq'));xClock();window.scrollTo({top:0});

function xFinish(auto){
  if(!X.active)return;
  xSave();
  const un=X.q.filter((q,j)=>!answered(q,X.ans[j])).length;
  if(!auto&&un>0&&!X._confirm){X._confirm=true;const f=$('#xend');if(f)f.textContent=`Hay ${un} sin contestar: pulsa otra vez para terminar`;return}
  X._confirm=false;X.active=false;clearInterval(X.timer);
  const res=X.q.map((d,j)=>({d,a:X.ans[j],ok:isRight(d,X.ans[j])}));
  const meta={exam:true,secs:Math.min(X.limit,Math.floor((Date.now()-X.t0)/1000)),unanswered:un};
  recordResults(res,meta,true);X.last=res;

xv.addEventListener('click',e=>{

  else if(!X.active&&(id==='rnew')){examHome()}
  else if(!X.active&&id==='rretry'){X.q=shuffle(X.last.filter(r=>!r.ok).map(r=>r.d));X.ans=[];X.flag=new Set();X.i=0;X.t0=Date.now();X.limit=Math.max(600,X.q.length*60);X.active=true;clearInterval(X.timer);X.timer=setInterval(xClock,1000);xShow()}
  else if(!X.active&&id==='rstudy'){goStudy(X.last.filter(r=>!r.ok).map(r=>r.d.n))}
  else if(!X.active)return;
  else if(id==='xnext'){xSave();X._confirm=false;if(X.i+1>=X.q.length){X.i=X.q.length-1;xFinish(false);}else{X.i++;xShow()}}
  else if(id==='xprev'){xSave();X.i--;xShow()}
  else if(id==='xflag'){xSave();X.flag.has(X.i)?X.flag.delete(X.i):X.flag.add(X.i);xShow()}

});

function quizHtml(list){

  }
  const it=q.items[q.i];
  return `<p class="pool" style="margin-top:12px">Pregunta ${q.i+1} de ${q.items.length}</p><div class="fc" style="cursor:default"><div class="big">${esc(it.en)}</div></div><div class="opts2" style="margin-top:12px">${it.opts.map((o,k)=>`<button class="opt" data-vq="${k}" style="text-align:left;cursor:pointer;font:inherit;color:inherit"><b>${L[k]}.</b><span>${esc(o)}</span></button>`).join('')}</div>${q.fb?`<p class="why ${q.fb.ok?'':'bad'}" style="margin-top:12px"><b>${q.fb.ok?'✔ Correcto':'✘ Incorrecto'}</b> · ${esc(it.en)} = ${esc(it.short)}</p><div class="foot"><button class="show" id="vqnext">Siguiente</button></div>`:''}`;
}
const shortEs=s=>s.split(':')[0];
function vQuizStart(){
  const pool=VOCAB.filter(v=>V_.cat==='all'||v[3]===V_.cat);
  const items=shuffle(pool).slice(0,10).map(v=>{
    const same=pool.filter(x=>x!==v&&shortEs(x[1])!==shortEs(v[1]));
    const opts=shuffle([shortEs(v[1]),...shuffle(same).slice(0,3).map(x=>shortEs(x[1]))]);
    return {en:v[0],short:shortEs(v[1]),opts};
  });
  V_.quiz={items,i:0,ok:0,fb:null};
}
$('#vocab').addEventListener('click',e=>{
  const t=e.target;
  const sv=t.closest('#vview button');
  if(sv){V_.view=sv.dataset.v;vocabRender();return}
  if(t.closest('#fc')){V_.flip=!V_.flip;vocabRender();return}
  const id=(t.closest('button')||{}).id;
  if(id==='vnext'){V_.i=(V_.i+1)%V_.order.length;V_.flip=false;vocabRender()}
  else if(id==='vprev'){V_.i=(V_.i-1+V_.order.length)%V_.order.length;V_.flip=false;vocabRender()}
  else if(id==='vknow'){const w=VOCAB[V_.order[V_.i]];known.add(w[0]);saveKnown();V_.order.splice(V_.i,1);if(V_.i>=V_.order.length)V_.i=0;V_.flip=false;if(V_.hideKnown)V_.order=[];vocabRender()}
  else if(id==='vagain'){const w=VOCAB[V_.order[V_.i]];known.delete(w[0]);saveKnown();V_.i=(V_.i+1)%V_.order.length;V_.flip=false;vocabRender()}
  else if(id==='vqgo'){vQuizStart();vocabRender()}
  else if(id==='vqnext'){V_.quiz.i++;V_.quiz.fb=null;vocabRender()}
  const vq=t.closest('[data-vq]');
  if(vq&&!V_.quiz.fb){const q=V_.quiz,it=q.items[q.i];const ok=it.opts[+vq.dataset.vq]===it.short;if(ok)q.ok++;else{known.delete(it.en);saveKnown()}q.fb={ok};vocabRender()}
});
$('#vocab').addEventListener('change',e=>{
  if(e.target.id==='vcat'){V_.cat=e.target.value;V_.order=[];V_.i=0;V_.flip=false;V_.quiz=null;vocabRender()}
  if(e.target.id==='vhk'){V_.hideKnown=e.target.checked;V_.order=[];V_.i=0;vocabRender()}
});
$('#vocab').addEventListener('input',e=>{
  if(e.target.id==='vsearch'){const q=e.target.value.toLowerCase();$$('#vlist > div').forEach(r=>r.classList.toggle('hide',q&&!r.textContent.toLowerCase().includes(q)))}
});
/* ---------- RESUMEN ---------- */
function cheatRender(){
  $('#cheat').innerHTML=`<div class="card"><h2 class="h2">Resumen para repasar</h2><p class="pool" style="margin:0">Las comparaciones que más se confunden en el examen.</p><div class="inline"><input type="search" id="csearch" placeholder="Buscar (ej. NSG, LRS, Key Vault)" style="flex:1 1 220px"></div></div>`+
  CHEAT.map(([title,cols,rows,note])=>`<details class="card" open><summary>${esc(title)}</summary><div class="tblwrap"><table class="ch"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<td><b>${esc(c)}</b></td>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${note?`<p class="pool">${esc(note)}</p>`:''}</details>`).join('');
}
$('#cheat').addEventListener('input',e=>{
  if(e.target.id!=='csearch')return;
  const q=e.target.value.toLowerCase();
  $$('#cheat details').forEach(d=>{
    let any=false;
    d.querySelectorAll('tbody tr').forEach(tr=>{const m=!q||tr.textContent.toLowerCase().includes(q)||d.querySelector('summary').textContent.toLowerCase().includes(q);tr.classList.toggle('hide',!m);any=any||m});
    d.classList.toggle('hide',!any);d.open=true;
  });
});
/* ---------- PROGRESO ---------- */
function progRender(){
  const seen=DATA.filter(d=>srs[d.n]);
  const A=seen.reduce((s,d)=>s+srs[d.n].a,0),C=seen.reduce((s,d)=>s+srs[d.n].c,0);
  const acc=A?Math.round(C/A*100):0;
  const boxes=[0,0,0,0,0,0];DATA.forEach(d=>boxes[srs[d.n]?srs[d.n].b:0]++);
  const dn=dueNow().length;
  const topicRows=TOPICS.map(t=>{
    const qs=DATA.filter(d=>d.topic===t);const s=qs.filter(d=>srs[d.n]);
    const a=s.reduce((x,d)=>x+srs[d.n].a,0),c=s.reduce((x,d)=>x+srs[d.n].c,0);
    return {t,n:qs.length,seen:s.length,acc:a?Math.round(c/a*100):null,studied:qs.filter(d=>done.has(d.n)).length};
  }).sort((a,b)=>(a.acc===null?-1:a.acc)-(b.acc===null?-1:b.acc));
  const traps=DATA.filter(d=>srs[d.n]&&srs[d.n].a>=2&&srs[d.n].c/srs[d.n].a<.5).sort((a,b)=>srs[a.n].c/srs[a.n].a-srs[b.n].c/srs[b.n].a).slice(0,20);
  const last=hist.slice(-10).reverse();
  $('#prog').innerHTML=`<div class="card"><h2 class="h2">Tu progreso</h2>
  <div class="tiles"><div class="tile"><b>${done.size}/${TOT}</b><span>estudiadas</span></div><div class="tile"><b>${seen.length}/${TOT}</b><span>practicadas en tests</span></div><div class="tile"><b>${A?acc+' %':'—'}</b><span>acierto global</span></div><div class="tile"><b>${dn}</b><span>para repasar hoy</span></div><div class="tile"><b>${wrong.size}</b><span>falladas pendientes</span></div></div>
  <div class="foot"><button class="show" id="pdue" ${dn?'':'disabled'}>Repasar las ${dn} de hoy</button><button class="btn" id="pwrong" ${wrong.size?'':'disabled'}>Ver falladas</button></div></div>
  <div class="card"><h3 class="h2" style="font-size:17px">Por tema</h3><p class="pool" style="margin:0 0 6px">Barra verde = acierto (rojo si baja del 70 %). Barra clara = preguntas practicadas.</p>${topicRows.map(r=>`<div class="brow"><span>${esc(r.t)}</span><div class="tr"><i style="width:${Math.round(r.seen/r.n*100)}%"></i>${r.acc!==null?`<u class="${r.acc<70?'low':''}" style="width:${r.acc}%"></u>`:''}</div><small>${r.acc===null?'sin datos':r.acc+' %'}</small></div>`).join('')}</div>
  <div class="card"><h3 class="h2" style="font-size:17px">Cajas de repaso espaciado</h3><p class="pool" style="margin:0 0 6px">Cada acierto sube la pregunta una caja (vuelve más tarde: 1, 3, 7 y 14 días). Un fallo la devuelve a la caja 1.</p>${['Sin ver','Caja 1','Caja 2','Caja 3','Caja 4','Caja 5 (dominada)'].map((n,i)=>`<div class="brow"><span>${n}</span><div class="tr"><u style="width:${Math.round(boxes[i]/TOT*100)}%"></u></div><small>${boxes[i]}</small></div>`).join('')}</div>
  <div class="card"><h3 class="h2" style="font-size:17px">Preguntas trampa</h3>${traps.length?`<p class="pool" style="margin:0 0 6px">Las que más fallas (dos o más intentos).</p><div class="inline">${traps.map(d=>`<span class="badge">P${d.n} · ${srs[d.n].c}/${srs[d.n].a}</span>`).join('')}</div><div class="foot"><button class="show" id="ptrap">Estudiar estas ${traps.length}</button></div>`:'<p class="pool" style="margin:0">Cuando hagas algunos tests aquí verás las preguntas que más se te resisten.</p>'}</div>
  <div class="card"><h3 class="h2" style="font-size:17px">Últimos tests</h3>${last.length?`<div class="hist">${last.map(h=>`<div><span>${new Date(h.t).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${h.m==='exam'?'examen':'test'}</span><span>${h.ok}/${h.n} · <b style="color:var(--${h.ok/h.n>=.7?'ok':'no'})">${Math.round(h.ok/h.n*100)} %</b></span></div>`).join('')}</div>`:'<p class="pool" style="margin:0">Todavía no has hecho ningún test.</p>'}</div>
  <div class="card"><h3 class="h2" style="font-size:17px">Copia de seguridad</h3><p class="pool" style="margin:0">Tu progreso se guarda solo en este navegador. Exporta un archivo para pasarlo a otro móvil u ordenador, o impórtalo aquí.</p>
  <div class="inline"><button class="btn" id="bexp">Exportar progreso</button><label class="btn" for="bimp" style="cursor:pointer">Importar archivo</label><input type="file" id="bimp" accept="application/json,.json" hidden><button class="btn danger" id="breset">Borrar todo mi progreso</button></div><div id="bmsg" class="pool"></div><textarea class="bk hide" id="btxt" readonly aria-label="Copia de seguridad"></textarea></div>`;
}
function backup(){return {v:1,done:[...done],wrong:[...wrong],favs:[...favs],srs,hist,known:[...known],prefs}}
$('#prog').addEventListener('click',e=>{
  const id=(e.target.closest('button')||{}).id;
  if(id==='pdue'){openTab('test');setup();$('#ts').value='smart';$('#tn').value=dueNow().length>10?'20':'10'}
  else if(id==='pwrong'){st.flt='wrong';$('#flt').value='wrong';st.focus=null;openTab('study');refilter()}
  else if(id==='ptrap'){const t=DATA.filter(d=>srs[d.n]&&srs[d.n].a>=2&&srs[d.n].c/srs[d.n].a<.5).sort((a,b)=>srs[a.n].c/srs[a.n].a-srs[b.n].c/srs[b.n].a).slice(0,20).map(d=>d.n);goStudy(t)}
  else if(id==='bexp'){
    const txt=JSON.stringify(backup());
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='az900-progreso.json';document.body.appendChild(a);a.click();a.remove();$('#bmsg').textContent='Archivo exportado.'}catch(x){}
    const ta=$('#btxt');ta.value=txt;ta.classList.remove('hide');
    if($('#bmsg').textContent==='')$('#bmsg').textContent='Copia este texto y guárdalo.';
  }
  else if(id==='breset'){
    const b=e.target.closest('button');
    if(b.dataset.sure){done=new Set();wrong=new Set();favs=new Set();srs={};hist=[];known=new Set();saveDone();saveW();saveFav();saveSrs();saveHist();saveKnown();renderStudy();progRender()}
    else{b.dataset.sure='1';b.textContent='¿Seguro? Pulsa otra vez para borrar'}
  }
});
$('#prog').addEventListener('change',e=>{
  if(e.target.id!=='bimp')return;
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const b=JSON.parse(r.result);
    done=new Set(b.done||[]);wrong=new Set(b.wrong||[]);favs=new Set(b.favs||[]);srs=b.srs||{};hist=b.hist||[];known=new Set(b.known||[]);
    if(b.prefs)prefs=Object.assign(prefs,b.prefs);
    saveDone();saveW();saveFav();saveSrs();saveHist();saveKnown();savePrefs();applyPrefs();renderStudy();progRender();$('#bmsg').textContent='Progreso importado.';
  }catch(x){$('#bmsg').textContent='El archivo no es válido.'}};
  r.readAsText(f);
});
/* ---------- arranque ---------- */
applyPrefs();renderStudy();
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
