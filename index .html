 "match", "qEn": "You plan to use Azure to host two apps named App1 and App2. ✑ You must be able to modify the code of App1. ✑ Administrative effort to manage the operating system of App1 must be minimized. ✑ App2 must run interactively with the operating system of the server. Which type of cloud service should you use for each app?", "qEs": "Planeas usar Azure para alojar dos aplicaciones, App1 y App2. ✑ Debes poder modificar el código de App1. ✑ Debe minimizarse el esfuerzo administrativo de gestionar el sistema operativo de App1. ✑ App2 debe ejecutarse de forma interactiva con el sistema operativo del servidor. ¿Qué tipo de servicio en la nube debes usar para cada aplicación?", "rows": [{"en": "App1", "es": "App1", "aEn": "PaaS", "aEs": "PaaS"}, {"en": "App2", "es": "App2", "aEn": "IaaS", "aEs": "IaaS"}], "pool": ["IaaS", "PaaS", "SaaS"], "why": "App1: modificar código sin gestionar el SO = PaaS. App2: acceso al SO = IaaS.", "topic": "Conceptos de nube", "dom": "conc", "exp": ["App1: modificas el código sin gestionar el SO: PaaS.", "App2: necesita acceso al sistema operativo: IaaS."]}, {"n": 83, "kind": "mc", "qEn": "You have an accounting application named App1 that uses a legacy database.\nYou plan to move App1 to the cloud.\nWhich service model should you use?", "qEs": "Tienes una aplicación de contabilidad llamada App1 que usa una base de datos heredada (legacy). Planeas llevar App1 a la nube. ¿Qué modelo de servicio debes usar?", "oEn": ["platform as a service (PaaS)", "infrastructure as a service (IaaS)", "software as a service (SaaS)"], "oEs": ["Plataforma como Servicio (PaaS)", "Infraestructura como Servicio (IaaS)", "Software como Servicio (SaaS)"], "ans": [1], "why": "Una base de datos heredada suele requerir control total del SO: IaaS.", "multi": false, "topic": "Conceptos de nube", "dom": "conc", "exp": ["PaaS: una base de datos heredada suele exigir control del SO.", "IaaS: control total del SO para la base de datos heredada. Correcta.", "SaaS: no permite instalar tu propia aplicación."]}, {"n": 84, "kind": "mc", "qEn": "Microsoft 365 is an example of which cloud service model?", "qEs": "Microsoft 365 es un ejemplo de ¿qué modelo de servicio en la nube?", "oEn": ["infrastructure as a service (IaaS)", "platform as a service (PaaS)", "software as a service (SaaS)"], "oEs": ["Infraestructura como Servicio (IaaS)", "Plataforma como Servicio (PaaS)", "Software como Servicio (SaaS)"], "ans": [2], "why": "Microsoft 365 es software listo para usar: SaaS.", "multi": false, "topic": "Conceptos de nube", "dom": "conc", "exp": ["No es IaaS: no gestionas servidores.", "No es PaaS: no desarrollas sobre una plataforma.", "Microsoft 365 es software listo para usar: SaaS. Correcta."]}, {"n": 85, "kind": "mc", "qEn": "An Azure web app that queries an on-premises Microsoft SQL Server database is an example of a ____ cloud.", "qEs": "Una aplicación web de Azure que consulta una base de datos Microsoft SQL Server local es un ejemplo de nube ____.", "oEn": ["hybrid", "multi-vendor", "private", "public"], "oEs": ["híbrida", "multiproveedor", "privada", "pública"], "ans": [0], "why": "Mezcla de nube y local = híbrida.", "multi": false, "topic": "Conceptos de nube", "dom": "conc", "exp": ["Híbrida: mezcla recursos en la nube con recursos locales. Correcta.", "Multiproveedor: usa nubes de varios proveedores.", "Privada: todo local.", "Pública: todo en la nube."]}, {"n": 86, "kind": "mc", "qEn": "A Microsoft SQL Server database hosted in the cloud and has software updates managed by Azure is an example of ____.", "qEs": "Una base de datos Microsoft SQL Server alojada en la nube, con las actualizaciones de software gestionadas por Azure, es un ejemplo de ____.", "oEn": ["DRaaS", "IaaS", "PaaS", "SaaS"], "oEs": ["DRaaS", "IaaS", "PaaS", "SaaS"], "ans": [2], "why": "Azure gestiona las actualizaciones: PaaS.", "multi": false, "topic": "Conceptos de nube", "dom": "conc", "exp": ["DRaaS: recuperación ante desastres como servicio, no es una base de datos.", "IaaS: tendrías que actualizar tú el software.", "PaaS: Azure gestiona el servidor y sus actualizaciones. Correcta.", "SaaS: es software final, no una base de datos para desarrolladores."]}, {"n": 87, "kind": "mc", "qEn": "Which cloud computing model includes on-premises and cloud-based resources?", "qEs": "¿Qué modelo de computación en la nube incluye recursos locales y recursos en la nube?", "oEn": ["hybrid", "public", "private"], "oEs": ["híbrido", "público", "privado"], "ans": [0], "why": "Híbrido = local + nube.", "multi": false, "topic": "Conceptos de nube", "dom": "conc", "exp": ["Híbrido: mezcla recursos locales y en la nube. Correcto.", "Público: todo en la nube del proveedor.", "Privado: todo en infraestructura propia."]}, {"n": 88, "kind": "mc", "qEn": "Autoscaling is an example of ____.", "qEs": "El autoescalado es un ejemplo de ____.", "oEn": ["agility", "elasticity", "geo-distribution", "predictability"], "oEs": ["agilidad", "elasticidad", "distribución geográfica", "previsibilidad"], "ans": [1], "why": "Elasticidad = ajustar recursos automáticamente a la demanda.", "multi": false, "topic": "Conceptos de nube", "dom": "conc", "exp": ["Agilidad: lanzar y cambiar rápido.", "Elasticidad: los recursos suben y bajan automáticamente con la demanda. Correcta.", "Distribución geográfica: desplegar en varias regiones.", "Previsibilidad: saber el coste o rendimiento esperado."]}, {"n": 89, "kind": "mc", "qEn": "____ supports synchronization between on-premises storage and Azure Storage.", "qEs": "____ admite la sincronización entre el almacenamiento local y Azure Storage.", "oEn": ["Azure Blob Storage", "Azure Files", "Azure Queue Storage", "Azure Table Storage"], "oEs": ["Azure Blob Storage", "Azure Files", "Azure Queue Storage", "Azure Table Storage"], "ans": [1], "why": "Azure File Sync sincroniza servidores de archivos locales con Azure Files.", "multi": false, "topic": "Almacenamiento y datos", "dom": "arq", "exp": ["Blob Storage: guarda objetos grandes, no sincroniza con servidores de archivos locales.", "Azure Files (con Azure File Sync) sincroniza con servidores locales. Correcta.", "Queue Storage: guarda mensajes.", "Table Storage: guarda datos no relacionales."]}, {"n": 90, "kind": "mc", "qEn": "Which term represents the ability to increase the computing capacity of a virtual machine by adding memory or CPUs?", "qEs": "¿Qué término representa la capacidad de aumentar la capacidad de cómputo de una máquina virtual añadiendo memoria o CPU?", "oEn": ["agility", "vertical scaling", "horizontal scaling", "elasticity"], "oEs": ["agilidad", "escalado vertical (vertical scaling)", "escalado horizontal (horizontal scaling)", "elasticidad"], "ans": [1], "why": "Vertical = hacer más grande la misma máquina. Horizontal = añadir más máquinas.", "multi": false, "topic": "Cómputo", "dom": "arq", "exp": ["Agilidad: rapidez para lanzar.", "Escalado vertical: hacer más grande una misma máquina (más CPU o memoria). Correcta.", "Escalado horizontal: añadir más máquinas.", "Elasticidad: ajustar recursos a la demanda automáticamente."]}, {"n": 91, "kind": "mc", "qEn": "What are two benefits of cloud computing? Each correct answer presents a complete solution.", "qEs": "¿Cuáles son dos beneficios de la computación en la nube? Cada respuesta correcta presenta una solución completa.", "oEn": ["enables the rapid provisioning of resources", "has increased administrative complexity", "has the same configuration options as on-premises", "shifts capital expenditures (CAPEX) to operating expenditures (OPEX)"], "oEs": ["permite aprovisionar recursos rápidamente", "tiene mayor complejidad administrativa", "tiene las mismas opciones de configuración que lo local", "traslada el gasto de capital (CAPEX) a gasto operativo (OPEX)"], "ans": [0, 3], "why": "Rapidez de aprovisionamiento y paso de CapEx a OpEx son ventajas clásicas de la nube.", "multi": true, "topic": "Conceptos de nube", "dom": "conc", "exp": ["Aprovisionar recursos rápidamente: es un beneficio. Correcta.", "Mayor complejidad administrativa: no es un beneficio, la nube la reduce.", "Mismas opciones que lo local: no es un beneficio concreto.", "De CapEx a OpEx: se paga por uso. Correcta."]}, {"n": 92, "kind": "mc", "qEn": "What is a feature of an Azure virtual network?", "qEs": "¿Cuál es una característica de una red virtual de Azure?", "oEn": ["resource cost analysis", "packet inspection", "geo-redundancy", "isolation and segmentation"], "oEs": ["análisis de costes de recursos", "inspección de paquetes", "geo-redundancia", "aislamiento y segmentación"], "ans": [3], "why": "Las VNet aíslan y segmentan los recursos.", "multi": false, "topic": "Redes", "dom": "arq", "exp": ["Análisis de costes: lo hace Cost Management.", "Inspección de paquetes: la hace un firewall.", "Geo-redundancia: es de Storage.", "Aislamiento y segmentación: las VNet aíslan y segmentan recursos. Correcta."]}, {"n": 93, "kind": "mc", "qEn": "____ enables Azure resources to be deployed close to users.", "qEs": "____ permite desplegar recursos de Azure cerca de los usuarios.", "oEn": ["Elasticity", "Geo-distribution", "High availability", "Scalability"], "oEs": ["La elasticidad", "La distribución geográfica", "La alta disponibilidad", "La escalabilidad"], "ans": [1], "why": "Geo-distribución = usar regiones cercanas a los usuarios.", "multi": false, "topic": "Regiones y alta disponibilidad", "dom": "arq", "exp": ["Elasticidad: ajustar a la demanda.", "Distribución geográfica: desplegar en regiones cercanas a los usuarios. Correcta.", "Alta disponibilidad: evitar caídas.", "Escalabilidad: crecer en capacidad."]}, {"n": 94, "kind": "match", "qEn": "Match the cloud computing benefits to the appropriate descriptions.", "qEs": "Relaciona los beneficios de la computación en la nube con las descripciones adecuadas.", "rows": [{"en": "Increase the compute capacity of apps in the cloud", "es": "Aumentar la capacidad de cómputo de las aplicaciones en la nube", "aEn": "Scalability", "aEs": "Escalabilidad"}, {"en": "Provide a continuous user experience with no apparent downtime", "es": "Dar una experiencia continua al usuario sin caídas aparentes", "aEn": "High availability", "aEs": "Alta disponibilidad"}, {"en": "Ensure users always have the best experience by deploying apps to all regions where there are users", "es": "Asegurar la mejor experiencia desplegando aplicaciones en todas las regiones donde hay usuarios", "aEn": "Geo-distribution", "aEs": "Distribución geográfica"}], "pool": ["Disaster recovery", "Geo-distribution", "High availability", "Scalability"], "why": "Cada beneficio se asocia con una descripción distinta.", "topic": "Conceptos de nube", "dom": "conc", "exp": ["Escalabilidad: aumentar la capacidad.", "Alta disponibilidad: experiencia continua sin caídas.", "Distribución geográfica: desplegar en las regiones donde hay usuarios."]}, {"n": 95, "kind": "mc", "qEn": "Which cloud computing benefit provides continuous user access to a cloud-based application with minimal downtime?", "qEs": "¿Qué beneficio de la nube ofrece acceso continuo a una aplicación en la nube con un tiempo de inactividad mínimo?", "oEn": ["agility", "scalability", "elasticity", "high availability"], "oEs": ["agilidad", "escalabilidad", "elasticidad", "alta disponibilidad"], "ans": [3], "why": "Alta disponibilidad = servicio casi siempre activo.", "multi": false, "topic": "Conceptos de nube", "dom": "conc", "exp": ["Agilidad: lanzar rápido.", "Escalabilidad: aumentar capacidad.", "Elasticidad: ajustar a la demanda.", "Alta disponibilidad: acceso continuo con mínimo tiempo de inactividad. Correcta."]}, {"n": 96, "kind": "mc", "qEn": "You need to identify the type of failure for which an Azure Availability Zone can be used to protect access to Azure services.\nWhat should you identify?", "qEs": "Debes identificar contra qué tipo de fallo se puede usar una zona de disponibilidad (Availability Zone) de Azure para proteger el acceso a los servicios. ¿Qué identificas?", "oEn": ["a physical server failure", "an Azure region failure", "a storage failure", "an Azure data center failure"], "oEs": ["un fallo de un servidor físico", "un fallo de una región de Azure", "un fallo de almacenamiento", "un fallo de un centro de datos de Azure"], "ans": [3], "why": "Las zonas son centros de datos separados dentro de una región; protegen ante la caída de uno de ellos.", "multi": false, "topic": "Regiones y alta disponibilidad", "dom": "arq", "exp": ["Fallo de un servidor: se cubre con un conjunto de disponibilidad.", "Fallo de región: se cubre con varias regiones.", "Fallo de almacenamiento: no es lo que cubren las zonas.", "Fallo de un centro de datos: las zonas son centros de datos separados. Correcta."]}, {"n": 97, "kind": "mc", "qEn": "You plan to extend your company's network to Azure. The network contains a VPN appliance that uses the IP address 131.107.200.1. You need to create an Azure resource that defines the VPN appliance in Azure. Which Azure resource should you create?", "qEs": "Planeas extender la red de tu empresa a Azure. La red contiene un dispositivo VPN con la dirección IP 131.107.200.1. Debes crear un recurso de Azure que defina ese dispositivo VPN en Azure. ¿Qué recurso creas?", "oEn": ["NAT gateways", "Application gateways", "Local network gateways", "Virtual network gateways", "On-premises Data Gateways", "Azure Data Box Gateway", "Azure Stack Edge / Data Box Gateway", "Web Application Firewall policies"], "oEs": ["NAT gateways", "Application gateways", "Local network gateways (puertas de enlace de red local)", "Virtual network gateways", "On-premises Data Gateways", "Azure Data Box Gateway", "Azure Stack Edge / Data Box Gateway", "Web Application Firewall policies"], "ans": [2], "why": "La local network gateway representa tu VPN local (con su IP) dentro de Azure.", "multi": false, "topic": "Redes", "dom": "arq", "exp": ["NAT gateway: da salida a Internet a una subred.", "Application Gateway: balanceador web.", ginal es «Resource groups» / grupos de recursos) para ver si es correcto.\nLos grupos de recursos permiten a las organizaciones gestionar el cumplimiento de los recursos de Azure en varias suscripciones.\nInstrucciones: revisa el texto subrayado. Si hace correcta la frase, elige «No se necesita cambio». Si es incorrecta, elige la opción que la corrige.", "oEn": ["No change is needed", "Management groups", "Azure policies", "Azure App Service plans"], "oEs": ["No se necesita cambio", "Grupos de administración (Management groups)", "Directivas de Azure (Azure policies)", "Planes de Azure App Service"], "ans": [1], "why": "Los grupos de administración agrupan varias suscripciones y permiten aplicar gobierno y cumplimiento sobre todas.", "multi": false, "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["No cambiar: los grupos de recursos organizan recursos dentro de una suscripción.", "Grupos de administración: agrupan varias suscripciones y aplican gobierno y cumplimiento sobre todas. Correcta.", "Directivas: definen reglas, pero no agrupan suscripciones.", "Planes de App Service: definen recursos de cómputo."]}, {"n": 102, "kind": "mc", "qEn": "Your company plans to migrate to Azure.\nThe company has several departments. All the Azure resources used by each department will be managed by a department administrator.\nWhat are two possible techniques to segment Azure for the departments? Each correct answer presents a complete solution.", "qEs": "Tu empresa planea migrar a Azure. Tiene varios departamentos. Todos los recursos de Azure de cada departamento los gestionará un administrador del departamento. ¿Cuáles son dos técnicas posibles para segmentar Azure por departamentos? Cada respuesta correcta presenta una solución completa.", "oEn": ["multiple subscriptions", "multiple Azure Active Directory (Azure AD) directories", "multiple regions", "multiple resource groups"], "oEs": ["varias suscripciones", "varios directorios de Azure Active Directory (Azure AD)", ilidad está integrada. Correcta.", "Escalado automático: no es el beneficio descrito.", "Compresión de datos: no.", "Control de versiones: no."]}, {"n": 155, "kind": "mc", "qEn": "You plan to deploy several Azure virtual machines.\nYou need to ensure that the services running on the virtual machines are available if a single data center fails.\nSolution: You deploy the virtual machines to two or more regions.\nDoes this meet the goal?", "qEs": "Planeas desplegar varias máquinas virtuales de Azure. Debes asegurarte de que los servicios que se ejecutan en ellas sigan disponibles si falla un único centro de datos.\nSolución: Despliegas las máquinas virtuales en dos o más regiones.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Regiones distintas son centros de datos distintos.", "multi": false, "topic": "Regiones y alta disponibilidad", "dom": "arq", "exp": ["Sí: varias regiones también sobreviven al fallo de un centro de datos. Correcta.", "No: sería incorrecto."]}, {"n": 156, "kind": "mc", "qEn": "An Azure container instance is an example of an Azure ____.", "qEs": "Una instancia de contenedor de Azure es un ejemplo de ____ de Azure.", "oEn": ["compute service", "identity service", "networking service", "storage service"], "oEs": ["servicio de cómputo", "servicio de identidad", "servicio de red", "servicio de almacenamiento"], "ans": [0], "why": "Los contenedores ejecutan aplicaciones: es cómputo.", "multi": false, "topic": "Cómputo", "dom": "arq", "exp": ["Servicio de cómputo: ejecuta contenedores. Correcta.", "Identidad: no.", "Red: no.", "Almacenamiento: no."]}, {"n": 157, "kind": "mc", "qEn": "At which OSI layer does ExpressRoute operate?", "qEs": "¿En qué capa del modelo OSI opera ExpressRoute?", "oEn": ["Layer 2", "Layer 3", "Layer 5", "Layer 7"], "oEs": ["Capa 2", "Capa 3", "Capa 5", "Capa 7"], "ans": [1], "why": "ExpressRoute es una conexión de capa 3 (enrutamiento, con BGP).", "multi": false, "topic": "Rede \nWhich two solutions should you recommend? Each correct answer presents a complete solution.", "qEs": "Planeas guardar 20 TB de datos en Azure. Se accederá a ellos de forma poco frecuente y se visualizarán con Microsoft Power BI. Debes recomendar una solución de almacenamiento. ¿Qué dos soluciones recomiendas? Cada respuesta correcta presenta una solución completa.", "oEn": ["Azure Data Lake", "Azure Cosmos DB", "Azure SQL Data Warehouse", "Azure SQL Database", "Azure Database for PostgreSQL"], "oEs": ["Azure Data Lake", "Azure Cosmos DB", "Azure SQL Data Warehouse", "Azure SQL Database", "Azure Database for PostgreSQL"], "ans": [0, 2], "why": "Data Lake y SQL Data Warehouse sirven para grandes volúmenes y analítica con Power BI.", "multi": true, "topic": "Almacenamiento y datos", "dom": "arq", "exp": ["Data Lake: datos poco accedidos y analizables en Power BI. Correcta.", "Cosmos DB: para acceso frecuente y baja latencia.", "SQL Data Warehouse: almacén analítico para Power BI. Correcta.", "SQL Database: transaccional.", "PostgreSQL: transaccional."]}, {"n": 161, "kind": "mc", "qEn": "You have an Azure environment that contains 10 web apps. To which URL should you connect to manage all the Azure resources? (options rebuilt from the dropdown pieces)", "qEs": "Tienes un entorno de Azure con 10 aplicaciones web. ¿A qué URL debes conectarte para gestionar todos los recursos de Azure? (opciones reconstruidas a partir de las piezas del desplegable)", "oEn": ["https://admin.azure.com", "https://portal.azure.com", "https://www.microsoft.com", "https://portal.azurewebsites.com"], "oEs": ["https://admin.azure.com", "https://portal.azure.com", "https://www.microsoft.com", "https://portal.azurewebsites.com"], "ans": [1], "why": "El portal de Azure está en https://portal.azure.com.", "multi": false, "topic": "Herramientas y gestión", "dom": "mgmt", "exp": ["admin.azure.com: no es el portal de gestión.", "portal.azure.com: portal de Azure. Correcta.", "microsoft.com: web general e (Help + support)", "Microsoft Defender for Cloud"], "ans": [3], "why": "El secure score se consulta en Microsoft Defender for Cloud.", "multi": false, "topic": "Identidad y seguridad", "dom": "arq", "exp": ["Azure Monitor: métricas y registros.", "Azure Advisor: recomendaciones de buenas prácticas.", "Help + support: soporte técnico.", "Defender for Cloud: muestra el secure score. Correcta."]}, {"n": 238, "kind": "mc", "qEn": "You can enable just in time (JIT) VM access by using ____", "qEs": "Puedes habilitar el acceso a VM Just-In-Time (JIT) usando ____", "oEn": ["Azure Bastion", "Azure Firewall", "Azure Front Door", "Microsoft Defender for Cloud"], "oEs": ["Azure Bastion", "Azure Firewall", "Azure Front Door", "Microsoft Defender for Cloud"], "ans": [3], "why": "El acceso JIT es una función de Defender for Cloud que cierra los puertos de gestión y los abre solo cuando se solicita.", "multi": false, "topic": "Identidad y seguridad", "dom": "arq", "exp": ["Bastion: acceso RDP/SSH seguro por el portal.", "Azure Firewall: filtra tráfico.", "Front Door: balanceo web global.", "Defender for Cloud: ofrece JIT para VM. Correcta."]}, {"n": 239, "kind": "mc", "qEn": "You can view your company's regulatory compliance report from ____", "qEs": "Puedes ver el informe de cumplimiento normativo de tu empresa desde ____", "oEn": ["Azure Advisor", "Azure Analysis Services", "Azure Monitor", "Microsoft Defender for Cloud"], "oEs": ["Azure Advisor", "Azure Analysis Services", "Azure Monitor", "Microsoft Defender for Cloud"], "ans": [3], "why": "El panel de cumplimiento normativo está en Defender for Cloud y permite descargar informes PDF/CSV.", "multi": false, "topic": "Gobierno y organización", "dom": "mgmt", "exp": ["Advisor: recomendaciones.", "Analysis Services: análisis de datos.", "Azure Monitor: métricas y registros.", "Defender for Cloud: muestra el informe de cumplimiento normativo. Correcta."]}, {"n": 240, "kind": "mc", "qEn": "You need to collect and automatically analyze security events from Azure Active Directory (Azure AD).\nWhat should you use?", "qEs": "Debes recopilar y analizar automáticamente los eventos de seguridad de Azure Active Directory (Azure AD).\n¿Qué debes usar?", "oEn": ["Microsoft Sentinel", "Azure Synapse Analytics", "Azure AD Connect", "Azure Key Vault"], "oEs": ["Microsoft Sentinel", "Azure Synapse Analytics", "Azure AD Connect", "Azure Key Vault"], "ans": [0], "why": "Sentinel recoge eventos de seguridad (también de Azure AD) y los analiza.", "multi": false, "topic": "Identidad y seguridad", "dom": "arq", "exp": ["Microsoft Sentinel: recopila y analiza eventos de seguridad, también de Azure AD. Correcta.", "Synapse Analytics: análisis de datos, no es SIEM.", "AD Connect: sincroniza identidades.", "Key Vault: guarda secretos."]}, {"n": 241, "kind": "mc", "qEn": "____ enables users to authenticate to multiple applications by using single sign-on (SSO).", "qEs": "____ permite a los usuarios autenticarse en varias aplicaciones usando inicio de sesión único (SSO).", "oEn": ["Application security groups in Azure", "Azure Active Directory (Azure AD)", "Azure Key Vault", "Microsoft Defender for Cloud"], "oEs": ["Los grupos de seguridad de aplicaciones de Azure", "Azure Active Directory (Azure AD)", "Azure Key Vault", "Microsoft Defender for Cloud"], "ans": [1], "why": "El SSO de aplicaciones empresariales lo ofrece Azure AD.", "multi": false, "topic": "Identidad y seguridad", "dom": "arq", "exp": ["Grupos de seguridad de aplicaciones: agrupan VM en reglas de red.", "Azure AD: ofrece inicio de sesión único (SSO) en varias aplicaciones. Correcta.", "Key Vault: guarda secretos.", "Defender for Cloud: evalúa la seguridad."]}, {"n": 242, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "A network security group (NSG) will block all network traffic by default.", "es": "Un grupo e sign-on (SSO)"], "why": "SSO = una credencial para varias apps; autorización = qué puede hacer; MFA = varios factores.", "topic": "Identidad y seguridad", "dom": "arq", "exp": ["SSO: usar las mismas credenciales en varios recursos y aplicaciones.", "Autorización: determina el nivel de acceso de un usuario o servicio.", "MFA: exige varios elementos para identificar a un usuario."]}, {"n": 244, "kind": "mc", "qEn": "Your company plans to automate the deployment of servers to Azure.\nYour manager is concerned that you may expose administrative credentials during the deployment.\nYou need to recommend an Azure solution that encrypts the administrative credentials during the deployment.\nWhat should you include in the recommendation?", "qEs": "Tu empresa planea automatizar el despliegue de servidores en Azure.\nA tu responsable le preocupa que puedas exponer credenciales administrativas durante el despliegue.\nDebes recomendar una solución de Azure que cifre las credenciales administrativas durante el despliegue.\n¿Qué debes incluir en la recomendación?", "oEn": ["Azure Key Vault", "Azure Information Protection", "Microsoft Defender for Cloud", "Azure Multi-Factor Authentication (MFA)"], "oEs": ["Azure Key Vault", "Azure Information Protection", "Microsoft Defender for Cloud", "Azure Multi-Factor Authentication (MFA)"], "ans": [0], "why": "Key Vault guarda las credenciales cifradas y evita ponerlas en texto plano en los scripts.", "multi": false, "topic": "Identidad y seguridad", "dom": "arq", "exp": ["Key Vault: guarda y protege secretos y credenciales, y permite usarlos en despliegues sin exponerlos. Correcta.", "Information Protection: clasifica y protege documentos.", "Defender for Cloud: evalúa la seguridad.", "MFA: añade verificación al iniciar sesión, no cifra credenciales de despliegue."]}, {"n": 245, "kind": "mc", "qEn": "After you create a virtual machine, you need to modify the ____ to allow connections to TCP port 8080 on the virtual machine.", "qEs": "Después de crear una máquina virtual, debes modificar ____ para permitir conexiones al puerto TCP 8080 de la máquina virtual.", "oEn": ["network security group (NSG)", "virtual network gateway", "virtual network", "route table"], "oEs": ["el grupo de seguridad de red (NSG)", "la puerta de enlace de red virtual", "la red virtual", "la tabla de rutas"], "ans": [0], "why": "El NSG filtra el tráfico por puerto y protocolo; ahí se añade una regla de entrada para el 8080.", "multi": false, "topic": "Redes", "dom": "arq", "exp": ["NSG: filtra el tráfico por puerto, así que allí se permite el puerto 8080. Correcta.", "Virtual network gateway: es para VPN y ExpressRoute.", "Red virtual: define el espacio de direcciones, no filtra puertos.", "Tabla de rutas: define el camino del tráfico, no lo filtra."]}, {"n": 246, "kind": "mc", "qEn": "Azure distributed denial of service (DDoS) protection is an example of protection that is implemented at the ____", "qEs": "La protección contra denegación de servicio distribuida (DDoS) de Azure es un ejemplo de protección implementada en la ____", "oEn": ["application layer", "compute layer", "networking layer", "perimeter layer"], "oEs": ["capa de aplicación", "capa de cómputo", "capa de red", "capa de perímetro"], "ans": [3], "why": "DDoS actúa en el perímetro.", "multi": false, "topic": "Identidad y seguridad", "dom": "arq", "dupOf": 232, "exp": ["Capa de aplicación: protege la aplicación.", "Capa de cómputo: protege las VM.", "Capa de red: segmenta y filtra el tráfico interno.", "Capa de perímetro: DDoS protege los bordes de la red. Correcta."]}, {"n": 247, "kind": "mc", "qEn": "Microsoft Sentinel uses playbooks to ____", "qEs": "Microsoft Sentinel usa playbooks para ____", "oEn": ["automatically respond to threats", "visualize data collected by connectors", "specify how long data is retained", "store passwords and certificates"], "oEs": ["responder automáticamente a las amenazas", "visualizar los datos recopilados por los conectores", "esp function poolFor(src,topic,incDup){
  let p=DATA.filter(d=>(incDup||!d.dupOf)&&(topic==='all'||d.topic===topic));
  if(src==='wrong')p=p.filter(d=>wrong.has(d.n));
  else if(src==='done')p=p.filter(d=>done.has(d.n));

function smartOrder(p){
  const now=Date.now();

  const unseen=shuffle(p.filter(d=>!srs[d.n]));
  const later=p.filter(d=>srs[d.n]&&srs[d.n].due>now).sort((a,b)=>srs[a.n].due-srs[b.n].due);

}

  let out=[];
  for(const k in want)out.push(...shuffle(pool.filter(d=>d.dom===k)).slice(0,want[k]));
  if(out.length<45){const ids=new Set(out.map(d=>d.n));out.push(...shuffle(pool.filter(d=>!ids.has(d.n))).slice(0,45-out.length))}
  return shuffle(out);
}
function xClock(){
  const left=Math.max(0,X.limit-Math.floor((Date.now()-X.t0)/1000));
  const c=$('#xclock');if(c){c.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');c.classList.toggle('low',left<300)}
  if(left<=0&&X.active)xFinish(true);
}
function xSave(){const d=X.q[X.i];if(d&&$('#xq'))X.ans[X.i]=getAns(d,$('#xq'))}
function xShow(){
  const d=X.q[X.i];
  const grid=X.q.map((q,j)=>`<button class="qn ${answered(q,X.ans[j])?'ans':''} ${X.flag.has(j)?'flag':''} ${j===X.i?'cur':''}" data-go="${j}">${j+1}</button>`).join('');
  xv.innerHTML=`<div class="card"><div class="top"><span class="num">${X.i+1} / ${X.q.length}</span><span class="tag">${KIND[d.kind]}${d.multi?` · elige ${d.ans.length}`:''}</span><span class="stat clock" id="xclock" style="margin-left:auto;width:auto"></span></div><div class="prog"><i style="width:${(X.ans.filter((a,j)=>answered(X.q[j],a)).length)/X.q.length*100}%"></i></div><div id="xq">${qCols(d)}</div>
  <div class="foot"><button class="btn" id="xprev" ${X.i===0?'disabled':''}>← Anterior</button><button class="show" id="xnext">${X.i+1>=X.q.length?'Revisar y terminar':'Siguiente →'}</button><button class="btn" id="xflag">${X.flag.has(X.i)?'Quitar marca':'Marcar para revisar'}</button><button class="btn danger" id="xend">Terminar examen</button></div>
  <div class="grid" id="xgrid">${grid}</div><p class="pool">Azul = contestada · borde amarillo = marcada para revisar.</p></div>`;
  setAns(d,X.ans[X.i],$('#xq'));xClock();window.scrollTo({top:0});
}
function xFinish(auto){
  if(!X.active)return;
  xSave();
  const un=X.q.filter((q,j)=>!answered(q,X.ans[j])).length;
  if(!auto&&un>0&&!X._confirm){X._confirm=true;const f=$('#xend');if(f)f.textContent=`Hay ${un} sin contestar: pulsa otra vez para terminar`;return}
  X._confirm=false;X.active=false;clearInterval(X.timer);
  const res=X.q.map((d,j)=>({d,a:X.ans[j],ok:isRight(d,X.ans[j])}));
  const meta={exam:true,secs:Math.min(X.limit,Math.floor((Date.now()-X.t0)/1000)),unanswered:un};
  recordResults(res,meta,true);X.last=res;
  resultView(xv,res,meta);
}
xv.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.id;
  if(id==='xgo'){setLang($('#xl').value);X.q=buildExam($('#xd').checked);X.ans=[];X.flag=new Set();X.i=0;X.t0=Date.now();X.limit=45*60;X.active=true;X._confirm=false;clearInterval(X.timer);X.timer=setInterval(xClock,1000);xShow()}
  else if(!X.active&&(id==='rnew')){examHome()}
  else if(!X.active&&id==='rretry'){X.q=shuffle(X.last.filter(r=>!r.ok).map(r=>r.d));X.ans=[];X.flag=new Set();X.i=0;X.t0=Date.now();X.limit=Math.max(600,X.q.length*60);X.active=true;clearInterval(X.timer);X.timer=setInterval(xClock,1000);xShow()}
  else if(!X.active&&id==='rstudy'){goStudy(X.last.filter(r=>!r.ok).map(r=>r.d.n))}
  else if(!X.active)return;
  else if(id==='xnext'){xSave();X._confirm=false;if(X.i+1>=X.q.length){X.i=X.q.length-1;xFinish(false);}else{X.i++;xShow()}}
  else if(id==='xprev'){xSave();X.i--;xShow()}
  else if(id==='xflag'){xSave();X.flag.has(X.i)?X.flag.delete(X.i):X.flag.add(X.i);xShow()}
  else if(id==='xend'){xFinish(false)}
  else if(b.dataset.go!==undefined){xSave();X.i=+b.dataset.go;X._confirm=false;xShow()}
});
/* ---------- teclado ---------- */
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='radio'&&e.target.type!=='checkbox')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;

  const i='abcdefghijkl'.indexOf(e.key.toLowerCase());

});
/* ---------- VOCABULARIO ---------- */
const V_={view:'cards',cat:'all',hideKnown:false,order:[],i:0,flip:false,quiz:null};
const CATN={f:'Palabras clave',e:'Frases del examen',t:'Términos de Azure y nube'};
function vFiltered(){return VOCAB.map((v,idx)=>({en:v[0],es:v[1],ex:v[2],c:v[3],idx})).filter(v=>(V_.cat==='all'||v.c===V_.cat)&&(!V_.hideKnown||!known.has(v.en)))}
function vocabRender(){
  const list=vFiltered();
  const nk=VOCAB.filter(v=>known.has(v[0])).length;
  let body='';
  if(V_.view==='cards'){
    if(!V_.order.length||V_.order.some(i=>!list.find(v=>v.idx===i)))V_.order=shuffle(list.map(v=>v.idx));
    const cur=VOCAB[V_.order[V_.i]];
    if(!cur)body='<p class="empty">No hay tarjetas con este filtro. ¡Quizá ya te las sabes todas!</p>';
    else body=`<div class="fc" id="fc" tabindex="0" role="button" aria-label="Girar tarjeta"><div class="lang">${CATN[cur[3]].toUpperCase()}</div><div class="big">${esc(cur[0])}</div>${V_.flip?`<div class="es">${esc(cur[1])}</div>${cur[2]?`<div class="ex">${esc(cur[2])}</div>`:''}`:'<div class="hint">Toca la tarjeta para ver la traducción</div>'}</div>
    <div class="inline"><button class="btn" id="vprev">← Anterior</button><button class="show" id="vknow">La sé ✔</button><button class="btn" id="vagain">Repasar ↻</button><button class="btn" id="vnext">Siguiente →</button><span class="stat">${V_.i+1} / ${V_.order.length}</span></div>`;
  }else if(V_.view==='list'){
    body=`<input type="search" id="vsearch" placeholder="Buscar palabra" style="margin-top:10px;width:100%"><div class="vl" id="vlist">${list.map(v=>`<div class="${known.has(v.en)?'kn':''}"><b>${esc(v.en)}</b><span>${esc(v.es)}${v.ex?`<br><small style="color:var(--mute)">${esc(v.ex)}</small>`:''}</span></div>`).join('')}</div>`;
  }else{
    body=quizHtml(list);
  }
  $('#vocab').innerHTML=`<div class="card"><h2 class="h2">Vocabulario clave</h2><p class="pool" style="margin:0">${VOCAB.length} palabras y frases que se repiten en el examen. Ya sabes ${nk}. Activa «Resaltar palabras clave» arriba para verlas subrayadas dentro de las preguntas (toca una para ver su traducción).</p>
  <div class="setup"><div class="seg" id="vview"><button data-v="cards" aria-pressed="${V_.view==='cards'}">Tarjetas</button><button data-v="list" aria-pressed="${V_.view==='list'}">Lista</button><button data-v="quiz" aria-pressed="${V_.view==='quiz'}">Mini test</button></div>
  <label for="vcat">Categoría<select id="vcat"><option value="all">Todas</option>${Object.entries(CATN).map(([k,v])=>`<option value="${k}" ${V_.cat===k?'selected':''}>${v}</option>`).join('')}</select></label>
  <label class="chk" for="vhk"><input type="checkbox" id="vhk" ${V_.hideKnown?'checked':''}> Ocultar las que ya sé</label></div>${body}</div>`;
}
function quizHtml(list){
  if(!V_.quiz)return `<div class="foot"><button class="show" id="vqgo">Empezar mini test (10 preguntas)</button></div><p class="pool">Te enseño una palabra en inglés y eliges su traducción.</p>`;
  const q=V_.quiz;
  if(q.i>=q.items.length){
    return `<div class="score ${q.ok>=7?'pass':'fail'}" style="margin-top:12px">${q.ok} / ${q.items.length}</div><p>Las que fallaste se han marcado para repasar.</p><div class="foot"><button class="show" id="vqgo">Otro mini test</button></div>`;
  }
  const it=q.items[q.i];
  return `<p class="pool" style="margin-top:12px">Pregunta ${q.i+1} de ${q.items.length}</p><div class="fc" style="cursor:default"><div class="big">${esc(it.en)}</div></div><div class="opts2" style="margin-top:12px">${it.opts.map((o,k)=>`<button class="opt" data-vq="${k}" style="text-align:left;cursor:pointer;font:inherit;color:inherit"><b>${L[k]}.</b><span>${esc(o)}</span></button>`).join('')}</div>${q.fb?`<p class="why ${q.fb.ok?'':'bad'}" style="margin-top:12px"><b>${q.fb.ok?'✔ Correcto':'✘ Incorrecto'}</b> · ${esc(it.en)} = ${esc(it.short)}</p><div class="foot"><button class="show" id="vqnext">Siguiente</button></div>`:''}`;
}
const shortEs=s=>s.split(':')[0];
function vQuizStart(){
  const pool=VOCAB.filter(v=>V_.cat==='all'||v[3]===V_.cat);
  const items=shuffle(pool).slice(0,10).map(v=>{
    const same=pool.filter(x=>x!==v&&shortEs(x[1])!==shortEs(v[1]));
    const opts=shuffle([shortEs(v[1]),...shuffle(same).slice(0,3).map(x=>shortEs(x[1]))]);
    return {en:v[0],short:shortEs(v[1]),opts};
  });
  V_.quiz={items,i:0,ok:0,fb:null};
}
$('#vocab').addEventListener('click',e=>{
  const t=e.target;
  const sv=t.closest('#vview button');
  if(sv){V_.view=sv.dataset.v;vocabRender();return}

  if(id==='vnext'){V_.i=(V_.i+1)%V_.order.length;V_.flip=false;vocabRender()}
  else if(id==='vprev'){V_.i=(V_.i-1+V_.order.length)%V_.order.length;V_.flip=false;vocabRender()}
  else if(id==='vknow'){const w=VOCAB[V_.order[V_.i]];known.add(w[0]);saveKnown();V_.order.splice(V_.i,1);if(V_.i>=V_.order.length)V_.i=0;V_.flip=false;if(V_.hideKnown)V_.order=[];vocabRender()}
  else if(id==='vagain'){const w=VOCAB[V_.order[V_.i]];known.delete(w[0]);saveKnown();V_.i=(V_.i+1)%V_.order.length;V_.flip=false;vocabRender()}
  else if(id==='vqgo'){vQuizStart();vocabRender()}
  else if(id==='vqnext'){V_.quiz.i++;V_.quiz.fb=null;vocabRender()}
  const vq=t.closest('[data-vq]');

});
$('#vocab').addEventListener('change',e=>{
  if(e.target.id==='vcat'){V_.cat=e.target.value;V_.order=[];V_.i=0;V_.flip=false;V_.quiz=null;vocabRender()}

function progRender(){
  const seen=DATA.filter(d=>srs[d.n]);
  const A=seen.reduce((s,d)=>s+srs[d.n].a,0),C=seen.reduce((s,d)=>s+srs[d.n].c,0);
  const acc=A?Math.round(C/A*100):0;
  const boxes=[0,0,0,0,0,0];DATA.forEach(d=>boxes[srs[d.n]?srs[d.n].b:0]++);
  const dn=dueNow().length;
  const topicRows=TOPICS.map(t=>{
    const qs=DATA.filter(d=>d.topic===t);const s=qs.filter(d=>srs[d.n]);
    const a=s.reduce((x,d)=>x+srs[d.n].a,0),c=s.reduce((x,d)=>x+srs[d.n].c,0);
    return {t,n:qs.length,seen:s.length,acc:a?Math.round(c/a*100):null,studied:qs.filter(d=>done.has(d.n)).length};
  }).sort((a,b)=>(a.acc===null?-1:a.acc)-(b.acc===null?-1:b.acc));
  const traps=DATA.filter(d=>srs[d.n]&&srs[d.n].a>=2&&srs[d.n].c/srs[d.n].a<.5).sort((a,b)=>srs[a.n].c/srs[a.n].a-srs[b.n].c/srs[b.n].a).slice(0,20);
  const last=hist.slice(-10).reverse();
  $('#prog').innerHTML=`<div class="card"><h2 class="h2">Tu progreso</h2>
  <div class="tiles"><div class="tile"><b>${done.size}/${TOT}</b><span>estudiadas</span></div><div class="tile"><b>${seen.length}/${TOT}</b><span>practicadas en tests</span></div><div class="tile"><b>${A?acc+' %':'—'}</b><span>acierto global</span></div><div class="tile"><b>${dn}</b><span>para repasar hoy</span></div><div class="tile"><b>${wrong.size}</b><span>falladas pendientes</span></div></div>
  <div class="foot"><button class="show" id="pdue" ${dn?'':'disabled'}>Repasar las ${dn} de hoy</button><button class="btn" id="pwrong" ${wrong.size?'':'disabled'}>Ver falladas</button></div></div>
  <div class="card"><h3 class="h2" style="font-size:17px">Por tema</h3><p class="pool" style="margin:0 0 6px">Barra verde = acierto (rojo si baja del 70 %). Barra clara = preguntas practicadas.</p>${topicRows.map(r=>`<div class="brow"><span>${esc(r.t)}</span><div class="tr"><i style="width:${Math.round(r.seen/r.n*100)}%"></i>${r.acc!==null?`<u class="${r.acc<70?'low':''}" style="width:${r.acc}%"></u>`:''}</div><small>${r.acc===null?'sin datos':r.acc+' %'}</small></div>`).join('')}</div>
  <div class="card"><h3 class="h2" style="font-size:17px">Cajas de repaso espaciado</h3><p class="pool" style="margin:0 0 6px">Cada acierto sube la pregunta una caja (vuelve más tarde: 1, 3, 7 y 14 días). Un fallo la devuelve a la caja 1.</p>${['Sin ver','Caja 1','Caja 2','Caja 3','Caja 4','Caja 5 (dominada)'].map((n,i)=>`<div class="brow"><span>${n}</span><div class="tr"><u style="width:${Math.round(boxes[i]/TOT*100)}%"></u></div><small>${boxes[i]}</small></div>`).join('')}</div>
  <div class="card"><h3 class="h2" style="font-size:17px">Preguntas trampa</h3>${traps.length?`<p class="pool" style="margin:0 0 6px">Las que más fallas (dos o más intentos).</p><div class="inline">${traps.map(d=>`<span class="badge">P${d.n} · ${srs[d.n].c}/${srs[d.n].a}</span>`).join('')}</div><div class="foot"><button class="show" id="ptrap">Estudiar estas ${traps.length}</button></div>`:'<p class="pool" style="margin:0">Cuando hagas algunos tests aquí verás las preguntas que más se te resisten.</p>'}</div>
  <div class="card"><h3 class="h2" style="font-size:17px">Últimos tests</h3>${last.length?`<div class="hist">${last.map(h=>`<div><span>${new Date(h.t).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${h.m==='exam'?'examen':'test'}</span><span>${h.ok}/${h.n} · <b style="color:var(--${h.ok/h.n>=.7?'ok':'no'})">${Math.round(h.ok/h.n*100)} %</b></span></div>`).join('')}</div>`:'<p class="pool" style="margin:0">Todavía no has hecho ningún test.</p>'}</div>
  <div class="card"><h3 class="h2" style="font-size:17px">Copia de seguridad</h3><p class="pool" style="margin:0">Tu progreso se guarda solo en este navegador. Exporta un archivo para pasarlo a otro móvil u ordenador, o impórtalo aquí.</p>
  <div class="inline"><button class="btn" id="bexp">Exportar progreso</button><label class="btn" for="bimp" style="cursor:pointer">Importar archivo</label><input type="file" id="bimp" accept="application/json,.json" hidden><button class="btn danger" id="breset">Borrar todo mi progreso</button></div><div id="bmsg" class="pool"></div><textarea class="bk hide" id="btxt" readonly aria-label="Copia de seguridad"></textarea></div>`;
}
function backup(){return {v:1,done:[...done],wrong:[...wrong],favs:[...favs],srs,hist,known:[...known],prefs}}
$('#prog').addEventListener('click',e=>{
  const id=(e.target.closest('button')||{}).id;

$('#prog').addEventListener('change',e=>{

});
