<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AZ-900 Estudio Bilingüe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky toolbar on top, then one card per question; EN and ES side by side on wide screens, stacked on phones */
:root{--bg:#f3f6f9;--card:#ffffff;--fg:#14202b;--mute:#586877;--line:#d6dee6;--accent:#0a64b4;--accent-bg:#e4f0fb;--ok:#14733c;--ok-bg:#e1f4e8;--no:#a3321f;--no-bg:#fbe9e5;--es:#fff7e0;--font:'Inter',system-ui,sans-serif;--head:'Space Grotesk','Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--card:#15222f;--fg:#e6edf4;--mute:#9bacbc;--line:#2a3b4c;--accent:#5ab0f2;--accent-bg:#16314a;--ok:#6fd49a;--ok-bg:#12392a;--no:#ff9a86;--no-bg:#432019;--es:#2b2610;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1620;--card:#15222f;--fg:#e6edf4;--mute:#9bacbc;--line:#2a3b4c;--accent:#5ab0f2;--accent-bg:#16314a;--ok:#6fd49a;--ok-bg:#12392a;--no:#ff9a86;--no-bg:#432019;--es:#2b2610;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;margin:0}
.wrap{max-width:1100px;margin:0 auto}
header{padding:28px 0 12px}
h1{font:700 28px/1.15 var(--head);margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--mute);max-width:70ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--card);color:var(--fg);border:0;padding:7px 12px;font:500 13px var(--font);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search],select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:14px var(--font);min-width:0}
input[type=search]{flex:1 1 160px}
.btn{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:500 13px var(--font);cursor:pointer}
.stat{color:var(--mute);font-size:13px;margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:16px;padding:16px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.num{font:700 15px var(--head);background:var(--accent-bg);color:var(--accent);padding:3px 10px;border-radius:5px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.done{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols.one{grid-template-columns:1fr}
.col{min-width:0}
.col.es{background:var(--es);border-radius:6px;padding:12px}
.col.en{padding:12px;border:1px solid var(--line);border-radius:6px}
.lang{font:700 11px var(--font);letter-spacing:.1em;color:var(--mute);margin-bottom:6px}
.q{white-space:pre-line;font-weight:500;margin:0 0 10px}
ul.opts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.opts li{display:flex;gap:8px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--card)}
ul.opts b{font-family:var(--head);color:var(--accent);flex:none}
ul.opts li.right{border-color:var(--ok);background:var(--ok-bg)}
.rows{display:grid;gap:6px}
.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--card)}
.row span.t{min-width:0}
.pill{flex:none;font:600 12px var(--font);border-radius:99px;padding:2px 10px;border:1px solid var(--line);color:var(--mute);background:var(--bg)}
.pill.y{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.pill.n{color:var(--no);background:var(--no-bg);border-color:var(--no)}
.pill.m{color:var(--accent);background:var(--accent-bg);border-color:var(--accent)}
.pool{font-size:13px;color:var(--mute);margin-top:8px}
.foot{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.show{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:600 13px var(--font);cursor:pointer}
.why{flex:1 1 280px;min-width:0;background:var(--ok-bg);border-radius:6px;padding:8px 12px;font-size:14px}
.why b{color:var(--ok)}
.hide{display:none!important}
.empty{color:var(--mute);text-align:center;padding:40px 0}
@media (max-width:760px){.cols{grid-template-columns:1fr}.stat{margin-left:0;width:100%}h1{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

.modes{padding:8px 0 4px}
.modes .seg button{padding:9px 16px;font-size:14px}
.h2{font:700 20px var(--head);margin:0 0 6px}
.setup{display:flex;flex-wrap:wrap;gap:12px 16px;margin:12px 0;align-items:flex-end}
.setup label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.setup label.chk{display:flex;gap:6px;align-items:center;padding-bottom:8px}
.opts2{display:grid;gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--card);cursor:default}
label.opt{cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
.opt b{font-family:var(--head);color:var(--accent);flex:none}
.opt input{margin-top:4px;flex:none}
.yn{display:flex;gap:12px;flex:none}
.yn label{display:flex;gap:4px;align-items:center;cursor:pointer;font-size:14px}
.row select{max-width:46%}
.prog{height:6px;background:var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.expl{margin-top:12px;font-size:14px}.expl ul{list-style:none;margin:6px 0 0;padding:0}.expl li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line,#8884)}.expl .em{flex:none;width:18px;font-weight:700}.expl .eok .em{color:var(--ok)}.expl .eno .em{color:var(--no)}
.why.bad{background:var(--no-bg)}.why.bad b{color:var(--no)}
.score{font:700 44px var(--head);line-height:1}
.score.pass{color:var(--ok)}.score.fail{color:var(--no)}
.btn:focus-visible,.show:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
<header>
<h1>AZ-900: preguntas en inglés y español</h1>
<p>Cada pregunta aparece en los dos idiomas. Pulsa «Ver respuesta» para ver la correcta y una explicación breve en español. Las preguntas de arrastrar/soltar y de «hotspot» (imágenes en el original) están reescritas en texto.</p>
</header>
<div class="modes"><div class="seg" id="modeseg"><button data-m="study" aria-pressed="true">Estudiar</button><button data-m="test" aria-pressed="false">Simulador de test</button></div></div>
<div id="study"><div class="bar" role="toolbar" aria-label="Opciones">
<div class="seg" id="langseg"><button data-l="both" aria-pressed="true">ES + EN</button><button data-l="es" aria-pressed="false">Solo ES</button><button data-l="en" aria-pressed="false">Solo EN</button></div>
<select id="range" aria-label="Rango de preguntas"></select>
<select id="kind" aria-label="Tipo de pregunta"><option value="all">Todos los tipos</option><option value="mc">Elegir opción</option><option value="yn">Sí / No por afirmación</option><option value="match">Relacionar</option></select>
<input type="search" id="q" placeholder="Buscar (ej. PaaS, resource group)" aria-label="Buscar">
<button class="btn" id="all">Ver todas las respuestas</button>
<button class="btn" id="pend" aria-pressed="false">Solo pendientes</button>
<span class="stat" id="stat"></span>
</div>
<main id="list"></main></div>
<section id="test" hidden></section>
</div>
<script>
const DATA=[{"n": 1, "kind": "mc", "qEn": "Your company intends to subscribe to an Azure support plan. The support plan must allow for new support requests to be opened. Which of the following are support plans that will allow this? (Select all that apply.)", "qEs": "Tu empresa piensa contratar un plan de soporte de Azure. El plan debe permitir abrir nuevas solicitudes de soporte. ¿Cuáles de los siguientes planes lo permiten? (Marca todos los que correspondan.)", "oEn": ["Basic", "Developer", "Standard", "Professional Direct", "Premier"], "oEs": ["Basic", "Developer", "Standard", "Professional Direct", "Premier"], "ans": [0, 1, 2, 3], "why": "⚠ Todos los planes de pago permiten abrir solicitudes y la clave excluye Premier, que es dudoso. Confírmalo con tu profe.", "multi": true, "disputed": true, "exp": ["Basic: sí permite abrir solicitudes, aunque solo de facturación y de suscripción.", "Developer: sí permite abrir solicitudes técnicas.", "Standard: sí permite abrir solicitudes técnicas con respuesta más rápida.", "Professional Direct: sí permite abrir solicitudes y añade soporte más cercano.", "Premier: la clave del documento no lo cuenta aquí, pero es un plan de pago que sí permite solicitudes (pregunta dudosa)."]}, {"n": 2, "kind": "mc", "qEn": "Your company has datacenters in Los Angeles and New York. The company has a Microsoft Azure subscription.\nYou are configuring the two datacenters as geo-clustered sites for site resiliency.\nYou need to recommend an Azure storage redundancy option.\nYou have the following data storage requirements:\n✑ Data must be stored on multiple nodes.\n✑ Data must be stored on nodes in separate geographic locations.\n✑ Data can be read from the secondary location as well as from the primary location\nWhich of the following Azure stored redundancy options should you recommend?", "qEs": "Tu empresa tiene centros de datos en Los Ángeles y Nueva York, y una suscripción de Microsoft Azure. Estás configurando los dos centros de datos como sitios geo-agrupados (geo-clustered) para dar resiliencia al sitio. Debes recomendar una opción de redundancia de almacenamiento de Azure. Requisitos de almacenamiento:\n✑ Los datos deben guardarse en varios nodos.\n✑ Los datos deben guardarse en nodos de ubicaciones geográficas distintas.\n✑ Los datos se pueden leer tanto desde la ubicación secundaria como desde la principal.\n¿Qué opción de redundancia de almacenamiento de Azure debes recomendar?", "oEn": ["Geo-redundant storage", "Read-only geo-redundant storage", "Zone-redundant storage", "Locally redundant storage"], "oEs": ["Almacenamiento con redundancia geográfica (GRS)", "Almacenamiento con redundancia geográfica de solo lectura (RA-GRS)", "Almacenamiento con redundancia de zona (ZRS)", "Almacenamiento con redundancia local (LRS)"], "ans": [1], "why": "RA-GRS copia los datos a otra región y permite LEER desde la secundaria. GRS también copia, pero la secundaria no se puede leer.", "multi": false, "exp": ["GRS: copia los datos a otra región, pero la copia secundaria no se puede leer hasta que hay una conmutación.", "RA-GRS: copia a otra región y además permite leer desde la ubicación secundaria. Cumple los tres requisitos.", "ZRS: copia en varias zonas de la misma región, no en ubicaciones geográficas distintas.", "LRS: copia solo dentro de un único centro de datos."]}, {"n": 3, "kind": "mc", "qEn": "Your company's Azure subscription includes a Basic support plan.\nThey would like to request an assessment of an Azure environment's design from Microsoft. This is, however, not supported by the existing plan.\nYou want to make sure that the company subscribes to a support plan that allows this functionality, while keeping expenses to a minimum.\nSolution: You recommend that the company subscribes to the Professional Direct support plan.\nDoes the solution meet the goal?", "qEs": "La suscripción de Azure de tu empresa incluye un plan de soporte Basic. Quieren pedirle a Microsoft una evaluación del diseño de un entorno de Azure, pero el plan actual no lo permite. Quieres asegurarte de que la empresa contrate un plan de soporte que permita esa funcionalidad, manteniendo los costes al mínimo.\nSolución: recomiendas que la empresa contrate el plan de soporte Professional Direct.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "⚠ Respuesta discutida en la comunidad (No 63 % / Sí 36 %). Confírmala con tu profe.", "multi": false, "disputed": true, "exp": ["Sí: Professional Direct no se considera el plan que cumple lo pedido con el coste mínimo (pregunta discutida).", "No: es la respuesta de la clave del documento (en la comunidad hay dudas)."]}, {"n": 4, "kind": "mc", "qEn": "You are tasked with deploying Azure virtual machines for your company.\nYou need to make use of the appropriate cloud deployment solution.\nSolution: You should make use of Software as a Service (SaaS).\nDoes the solution meet the goal?", "qEs": "Se te encarga desplegar máquinas virtuales (VM) de Azure para tu empresa. Debes usar la solución de despliegue en la nube adecuada.\nSolución: Debes usar Software como Servicio (SaaS).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Las VM de Azure son IaaS, no SaaS.", "multi": false, "exp": ["Sí: SaaS es software ya hecho (como Microsoft 365). No sirve para desplegar VM.", "No: las VM son infraestructura, no software como servicio."]}, {"n": 5, "kind": "mc", "qEn": "You are tasked with deploying Azure virtual machines for your company.\nYou need to make use of the appropriate cloud deployment solution.\nSolution: You should make use of Platform as a Service (PaaS).\nDoes the solution meet the goal?", "qEs": "Se te encarga desplegar máquinas virtuales (VM) de Azure para tu empresa. Debes usar la solución de despliegue en la nube adecuada.\nSolución: Debes usar Plataforma como Servicio (PaaS).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Las VM de Azure son IaaS, no PaaS.", "multi": false, "exp": ["Sí: PaaS es para publicar aplicaciones sin gestionar el SO; no es el modelo de las VM.", "No: las VM no son PaaS."]}, {"n": 6, "kind": "mc", "qEn": "You are tasked with deploying Azure virtual machines for your company.\nYou need to make use of the appropriate cloud deployment solution.\nSolution: You should make use of Infrastructure as a Service (IaaS).\nDoes the solution meet the goal?", "qEs": "Se te encarga desplegar máquinas virtuales (VM) de Azure para tu empresa. Debes usar la solución de despliegue en la nube adecuada.\nSolución: Debes usar Infraestructura como Servicio (IaaS).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Las máquinas virtuales son el ejemplo típico de IaaS.", "multi": false, "exp": ["Sí: las VM son el ejemplo clásico de IaaS; tú gestionas el sistema operativo.", "No sería correcto: justo eso es IaaS."]}, {"n": 7, "kind": "mc", "qEn": "Your developers have created 10 web applications that must be host on Azure.\nYou need to determine which Azure web tier plan to host the web apps. The web tier plan must meet the following requirements:\n✑ The web apps will use custom domains.\n✑ The web apps each require 10 GB of storage.\n✑ The web apps must each run in dedicated compute instances.\n✑ Load balancing between instances must be included.\n✑ Costs must be minimized.\nWhich web tier plan should you use?", "qEs": "Tus desarrolladores han creado 10 aplicaciones web que deben alojarse en Azure. Debes decidir qué plan del nivel web (web tier) de Azure usar. El plan debe cumplir estos requisitos:\n✑ Las aplicaciones web usarán dominios personalizados.\n✑ Cada aplicación web necesita 10 GB de almacenamiento.\n✑ Cada aplicación web debe ejecutarse en instancias de cómputo dedicadas.\n✑ Debe incluirse el balanceo de carga entre instancias.\n✑ Se deben minimizar los costes.\n¿Qué plan debes usar?", "oEn": ["Standard", "Basic", "Free", "Shared"], "oEs": ["Standard", "Basic", "Free", "Shared"], "ans": [0], "why": "⚠ Discutida: Basic también cumple dominio personalizado, 10 GB y balanceo, y es más barato. La clave da Standard. Confírmala con tu profe.", "multi": false, "disputed": true, "exp": ["Standard (clave del documento): cómputo dedicado, dominio personalizado y balanceo de carga.", "Basic: también tiene instancias dedicadas y dominio propio, por eso la pregunta es discutida.", "Free: cómputo compartido, sin balanceo de carga.", "Shared: cómputo compartido, sin instancias dedicadas."]}, {"n": 8, "kind": "mc", "qEn": "You are planning to migrate a company to Azure. Each of the company's numerous divisions will have an administrator in place to manage the Azure resources used by their respective division.\nYou want to make sure that the Azure deployment you employ allows for Azure to be segmented for the divisions, while keeping administrative effort to a minimum.\nSolution: You plan to make use of several Azure Active Directory (Azure AD) directories.\nDoes the solution meet the goal?", "qEs": "Planeas migrar una empresa a Azure. Cada una de sus numerosas divisiones tendrá un administrador que gestione los recursos de Azure de su división. Quieres que el despliegue de Azure permita segmentar Azure por divisiones, manteniendo el esfuerzo administrativo al mínimo.\nSolución: planeas usar varios directorios de Azure Active Directory (Azure AD).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Varios directorios aumentan mucho la administración. Para segmentar basta con varias suscripciones (o grupos de recursos).", "multi": false, "exp": ["Sí: no es lo mejor; varios directorios aumentan la administración y no sirven para segmentar recursos.", "No: para segmentar basta con suscripciones o grupos de recursos."]}, {"n": 9, "kind": "mc", "qEn": "Your developers have created a portal web app for users in the Miami branch office. The web app will be publicly accessible and used by the Miami users to retrieve customer and product information. The web app is currently running in an on-premises test environment.\nYou plan to host the web app on Azure.\nYou need to determine which Azure web tier plan to host the web app. The web tier plan must meet the following requirements:\n✑ The website will use the miami.weyland.com URL.\n✑ The website will be deployed to two instances.\n✑ SSL support must be included.\n✑ The website requires 12 GB of storage.\n✑ Costs must be minimized.\nWhich web tier plan should you use?", "qEs": "Tus desarrolladores han creado una aplicación web de portal para los usuarios de la oficina de Miami. La aplicación será pública y los usuarios de Miami la usarán para consultar información de clientes y productos. Ahora está en un entorno de pruebas local (on-premises). Planeas alojarla en Azure. Debes decidir qué plan del nivel web de Azure usar. Requisitos:\n✑ El sitio usará la URL miami.weyland.com.\n✑ El sitio se desplegará en dos instancias.\n✑ Debe incluir soporte SSL.\n✑ El sitio necesita 12 GB de almacenamiento.\n✑ Se deben minimizar los costes.\n¿Qué plan debes usar?", "oEn": ["Standard", "Basic", "Free", "Shared"], "oEs": ["Standard", "Basic", "Free", "Shared"], "ans": [0], "why": "Basic solo da 10 GB y se necesitan 12 GB; Free/Shared no sirven para 2 instancias dedicadas. Queda Standard.", "multi": false, "exp": ["Standard: 2 instancias dedicadas, SSL, dominio propio y 50 GB de almacenamiento.", "Basic: solo 10 GB y se necesitan 12 GB.", "Free: cómputo compartido, no cumple.", "Shared: cómputo compartido, no permite 2 instancias dedicadas."]}, {"n": 10, "kind": "mc", "qEn": "Your company is planning to migrate all their virtual machines to an Azure pay-as-you-go subscription. The virtual machines are currently hosted on the Hyper-V hosts in a data center.\nYou are required make sure that the intended Azure solution uses the correct expenditure model.\nSolution: You should recommend the use of the elastic expenditure model.\nDoes the solution meet the goal?", "qEs": "Tu empresa planea migrar todas sus máquinas virtuales a una suscripción de Azure de pago por uso (pay-as-you-go). Las VM están alojadas actualmente en hosts Hyper-V de un centro de datos. Debes asegurarte de que la solución de Azure use el modelo de gasto correcto.\nSolución: Recomiendas usar el modelo de gasto elástico (elastic).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "El pago por uso es gasto operativo (OpEx); «elástico» no es un modelo de gasto.", "multi": false, "exp": ["Sí: «elástico» describe crecer y decrecer con la demanda; no es un modelo de gasto.", "No: el modelo de gasto correcto es el operativo (OpEx)."]}, {"n": 11, "kind": "mc", "qEn": "Your company is planning to migrate all their virtual machines to an Azure pay-as-you-go subscription. The virtual machines are currently hosted on the Hyper-V hosts in a data center.\nYou are required make sure that the intended Azure solution uses the correct expenditure model.\nSolution: You should recommend the use of the scalable expenditure model.\nDoes the solution meet the goal?", "qEs": "Tu empresa planea migrar todas sus máquinas virtuales a una suscripción de Azure de pago por uso (pay-as-you-go). Las VM están alojadas actualmente en hosts Hyper-V de un centro de datos. Debes asegurarte de que la solución de Azure use el modelo de gasto correcto.\nSolución: Recomiendas usar el modelo de gasto escalable (scalable).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "El pago por uso es gasto operativo (OpEx); «escalable» no es un modelo de gasto.", "multi": false, "exp": ["Sí: «escalable» es una capacidad técnica, no un modelo de gasto.", "No: el modelo correcto es OpEx."]}, {"n": 12, "kind": "mc", "qEn": "Your company is planning to migrate all their virtual machines to an Azure pay-as-you-go subscription. ntity from any country.", "A European government contractor.", "A European government entity.", "A United States government contractor.", "A United States government entity."], "oEs": ["Un contratista del gobierno de cualquier país.", "Una entidad gubernamental de cualquier país.", "Un contratista del gobierno europeo.", "Una entidad del gobierno europeo.", "Un contratista del gobierno de EE. UU.", "Una entidad del gobierno de EE. UU."], "ans": [4, 5], "why": "Azure Government es una nube aislada solo para el gobierno de EE. UU. y sus contratistas.", "multi": true, "exp": ["Contratista de cualquier país: Azure Government es solo para EE. UU.", "Entidad de gobierno de cualquier país: solo EE. UU.", "Contratista europeo: no está permitido.", "Entidad europea: no está permitido.", "Contratista del gobierno de EE. UU.: permitido.", "Entidad del gobierno de EE. UU.: permitido."]}, {"n": 29, "kind": "mc", "qEn": "Your company has an Azure Active Directory (Azure AD) environment. Users occasionally connect to Azure AD via the Internet.\nYou have been tasked with making sure that users who connect to Azure AD via the internet from an unidentified IP address, are automatically encouraged to change passwords.\nSolution: You configure the use of Azure AD Identity Protection.\nDoes the solution meet the goal?", "qEs": "Tu empresa tiene un entorno de Azure Active Directory (Azure AD). Los usuarios a veces se conectan a Azure AD por Internet. Debes asegurarte de que los usuarios que se conectan a Azure AD por Internet desde una dirección IP no identificada reciban automáticamente la indicación de cambiar su contraseña.\nSolución: Configuras el uso de Azure AD Identity Protection.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Identity Protection detecta inicios de sesión de riesgo (p. ej., IP desconocida) y puede forzar el cambio de contraseña.", "multi": false, "exp": ["Sí: Identity Protection detecta inicios de sesión de riesgo y puede forzar el cambio de contraseña.", "No sería correcto: es el servicio adecuado."]}, {"n": 30, "kind": "mc", "qEn": "Your company has an Azure Active Directory (Azure AD) environment. Users occasionally connect to Azure AD via the Internet.\nYou have been tasked with making sure that users who connect to Azure AD via the internet from an unidentified IP address, are automatically encouraged to change passwords.\nSolution: You configure the use of Azure AD Privileged Identity Management.\nDoes the solution meet the goal?", "qEs": "Tu empresa tiene un entorno de Azure Active Directory (Azure AD). Los usuarios a veces se conectan a Azure AD por Internet. Debes asegurarte de que los usuarios que se conectan a Azure AD por Internet desde una dirección IP no identificada reciban automáticamente la indicación de cambiar su contraseña.\nSolución: Configuras el uso de Azure AD Privileged Identity Management.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "PIM gestiona el acceso privilegiado (roles); no reacciona a inicios de sesión de riesgo.", "multi": false, "exp": ["Sí: PIM gestiona accesos privilegiados (roles) y no reacciona a IP desconocidas.", "No: no cumple el objetivo."]}, {"n": 31, "kind": "mc", "qEn": "You are planning a strategy to deploy numerous web servers and database servers to Azure.\nThis strategy should allow for connection types between the web servers and database servers to be controlled.\nSolution: You include network security groups (NSGs) in your strategy.\nDoes the solution meet the goal?", "qEs": "Estás planificando una estrategia para desplegar muchos servidores web y servidores de base de datos en Azure. La estrategia debe permitir controlar los tipos de conexión entre los servidores web y los servidores de base de datos.\nSolución: Incluyes grupos de seguridad de red (NSG) en tu estrategia.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Los NSG permiten o bloquean el tráfico entre recursos.", "multi": false, "exp": ["Sí: los NSG permiten o bloquean el tráfico entre servidores web y de base de datos.", "No sería correcto: los NSG hacen justo eso."]}, {"n": 32, "kind": "mc", "qEn": "You are planning a strategy to deploy numerous web servers and database servers to Azure.\nThis strategy should allow for connection types between the web servers and database servers to be controlled.\nSolution: You include a local network gateway in your strategy.\nDoes the solution meet the goal?", "qEs": "Estás planificando una estrategia para desplegar muchos servidores web y servidores de base de datos en Azure. La estrategia debe permitir controlar los tipos de conexión entre los servidores web y los servidores de base de datos.\nSolución: Incluyes una puerta de enlace de red local (local network gateway) en tu estrategia.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "La local network gateway representa tu VPN local; no controla tráfico entre servidores.", "multi": false, "exp": ["Sí: la local network gateway representa tu VPN local; no filtra tráfico entre servidores.", "No: no controla tipos de conexión."]}, {"n": 33, "kind": "mc", "qEn": "Your company's Active Directory forest includes thousands of user accounts.\nYou have been informed that all network resources will be migrated to Azure. Thereafter, the on-premises data center will be retired.\nYou are required to employ a strategy that reduces the effect on users, once the planned migration has been completed.\nSolution: You plan to require Azure Multi-Factor Authentication (MFA).\nDoes the solution meet the goal?", "qEs": "El bosque de Active Directory de tu empresa incluye miles de cuentas de usuario. Te han informado de que todos los recursos de red se migrarán a Azure y que después se cerrará el centro de datos local. Debes aplicar una estrategia que reduzca el impacto en los usuarios una vez completada la migración.\nSolución: Planeas exigir Azure Multi-Factor Authentication (MFA).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "MFA añade seguridad, pero no reduce el impacto de la migración. Lo que ayuda es sincronizar cuentas con Azure AD.", "multi": false, "exp": ["Sí: MFA añade seguridad, pero no reduce el impacto de la migración.", "No: lo que ayuda es sincronizar las cuentas con Azure AD."]}, {"n": 34, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "PaaS web apps provide full control of the operating system that hosts the apps.", "es": "Las aplicaciones web PaaS dan control total del sistema operativo que las aloja.", "yes": false}, {"en": "PaaS provides the ability to scale the platform automatically.", "es": "PaaS permite escalar la plataforma automáticamente.", "yes": true}, {"en": "PaaS provides professional development services to continuously add features to custom applications.", "es": "PaaS ofrece servicios de desarrollo profesional para añadir funciones continuamente a aplicaciones personalizadas.", "yes": true}], "why": "En PaaS no controlas el SO (lo gestiona Azure).", "exp": ["PaaS no da control del sistema operativo: lo gestiona Azure. Por eso es No.", "PaaS permite autoescalado. Sí.", "PaaS ofrece herramientas de desarrollo para evolucionar las aplicaciones. Sí."]}, {"n": 35, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "Azure provides flexibility between capital expenditure (CapEx) and operational expenditure (OpEx).", "es": "Azure ofrece flexibilidad entre gasto de capital (CapEx) y gasto operativo (OpEx).", "yes": true}, {"en": "If you create two Azure virtual machines that use the B2S size, each virtual machine will always generate the same monthly costs.", "es": "Si creas dos máquinas virtuales de tamaño B2S, cada una generará siempre el mismo coste mensual.", "yes": false}, {"en": "When you stop an Azure virtual machine, you continue to pay storage costs associated to the virtual machine.", "es": "Cuando detienes una máquina virtual de Azure, sigues pagando los costes de almacenamiento asociados.", "yes": true}], "why": "El coste depende del uso y de otros recursos (discos, IP…); un disco sigue costando aunque la VM esté parada.", "exp": ["Azure permite pasar de CapEx a OpEx y mezclarlos. Sí.", "El coste depende del uso real, así que no es siempre igual. No.", "Con la VM detenida sigues pagando el disco (almacenamiento). Sí."]}, {"n": 36, "kind": "mc", "qEn": "When implementing a Software as a Service (SaaS) solution, you are responsible for ____.", "qEs": "Al implementar una solución de Software como Servicio (SaaS), eres responsable de ____.", "oEn": ["configuring high availability", "defining scalability rules", "installing the SaaS solution", "configuring the SaaS solution"], "oEs": ["configurar la alta disponibilidad", "definir las reglas de escalabilidad", "instalar la solución SaaS", "configurar la solución SaaS"], "ans": [3], "why": "En SaaS solo configuras la aplicación; el proveedor se ocupa del resto.", "multi": false, "exp": ["Alta disponibilidad: la gestiona el proveedor en SaaS.", "Escalabilidad: la gestiona el proveedor.", "Instalar: el proveedor ya la tiene instalada.", "Configurar la solución SaaS: es lo único que haces tú. Correcta."]}, {"n": 37, "kind": "mc", "qEn": "You have an on-premises network that contains several servers.\nYou plan to migrate all the servers to Azure.\nYou need to recommend a solution to ensure that some of the servers are available if a single Azure data center goes offline for an extended period.\nWhat should you include in the recommendation?", "qEs": "Tienes una red local (on-premises) con varios servidores. Planeas migrar todos los servidores a Azure. Debes recomendar una solución que garantice que algunos servidores sigan disponibles si un único centro de datos de Azure queda fuera de servicio durante un periodo prolongado. ¿Qué debes incluir en la recomendación?", "oEn": ["fault tolerance", "elasticity", "scalability", "low latency"], "oEs": ["tolerancia a fallos (fault tolerance)", "elasticidad", "escalabilidad", "baja latencia"], "ans": [0], "why": "Tolerancia a fallos = el sistema sigue funcionando aunque algo falle (p. ej., un centro de datos).", "multi": false, "exp": ["Tolerancia a fallos: el servicio sigue funcionando aunque falle un centro de datos. Correcta.", "Elasticidad: ajustar recursos a la demanda, no a fallos.", "Escalabilidad: crecer o decrecer, no resistir fallos.", "Baja latencia: rapidez de respuesta, no disponibilidad ante fallos."]}, {"n": 38, "kind": "mc", "qEn": "An organization that hosts its infrastructure ____ no longer requires a data center.", "qEs": "Una organización que aloja su infraestructura ____ ya no necesita un centro de datos.", "oEn": ["in a private cloud", "in a hybrid cloud", "in the public cloud", "on a Hyper-V host"], "oEs": ["en una nube privada", "en una nube híbrida", "en la nube pública", "en un host Hyper-V"], "ans": [2], "why": "Solo con la nube pública no necesitas un centro de datos propio.", "multi": false, "exp": ["Nube privada: sigue requiriendo un centro de datos propio.", "Nube híbrida: mantiene parte en tu centro de datos.", "Nube pública: todo está en el proveedor, sin centro de datos propio. Correcta.", "Host Hyper-V: es infraestructura local."]}, {"n": 39, "kind": "mc", "qEn": "What are two characteristics of the public cloud? Each correct answer presents a complete solution.", "qEs": "¿Cuáles son dos características de la nube pública? Cada respuesta correcta presenta una solución completa.", "oEn": ["dedicated hardware", "unsecured connections", "limited storage", "metered pricing", "self-service management"], "oEs": ["hardware dedicado", "conexiones sin seguridad", "almacenamiento limitado", "precios medidos (pago por uso)", "gestión de autoservicio"], "ans": [3, 4], "why": "En la nube pública pagas lo que consumes y gestionas tú mismo los recursos desde un portal.", "multi": true, "exp": ["Hardware dedicado: es propio de la nube privada.", "Conexiones sin seguridad: no es característica de la nube pública.", "Almacenamiento limitado: al contrario, es muy ampliable.", "Precios medidos: pagas lo que consumes. Correcta.", "Autoservicio: tú creas recursos desde un portal. Correcta."]}, {"n": 40, "kind": "mc", "qEn": "When planning to migrate a public website to Azure, you must plan to ____.", "qEs": "Al planificar la migración de un sitio web público a Azure, debes planificar ____.", "oEn": ["deploy a VPN", "pay monthly usage costs", "pay to transfer all the website data to Azure", "reduce the number of connections to the website"], "oEs": ["desplegar una VPN", "pagar los costes mensuales de uso", "pagar por transferir todos los datos del sitio web a Azure", "reducir el número de conexiones al sitio web"], "ans": [1], "why": "Azure es pago por uso: recibirás una factura mensual. La entrada de datos a Azure es gratuita.", "multi": false, "exp": ["VPN: no es obligatoria para un sitio público.", "Pagar costes mensuales de uso: Azure es pago por uso. Correcta.", "Pagar por transferir datos hacia Azure: la entrada de datos es gratuita.", "Reducir conexiones: no es un requisito de migración."]}, {"n": 41, "kind": "mc", "qEn": "Your company plans to migrate all its data and resources to Azure.\nThe company's migration plan states that only Platform as a Service (PaaS) solutions must be used in Azure.\nYou need to deploy an Azure environment that meets the company migration plan.\nSolution: You create an Azure App Service and Azure SQL databases.\nDoes this meet the goal?", "qEs": "Tu empresa planea migrar todos sus datos y recursos a Azure. El plan de migración establece que solo se deben usar soluciones de Plataforma como Servicio (PaaS) en Azure. Debes desplegar un entorno de Azure que cumpla el plan de migración de la empresa.\nSolución: Creas un Azure App Service y bases de datos Azure SQL.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "App Service y Azure SQL Database son PaaS.", "multi": false, "exp": ["Sí: App Service y Azure SQL Database son servicios PaaS. Todo el entorno es PaaS.", "No sería correcto: ambos son PaaS."]}, {"n": 42, "kind": "mc", "qEn": "Your company plans to migrate all its data and resources to Azure.\nThe company's migration plan states that only Platform as a Service (PaaS) solutions must be used in Azure.\nYou need to deploy an Azure environment that meets the company migration plan.\nSolution: You create an Azure App Service and Azure virtual machines that have Microsoft SQL Server installed.\nDoes this meet the goal?", "qEs": "Tu empresa planea migrar todos sus datos y recursos a Azure. El plan de migración establece que solo se deben usar soluciones de Plataforma como Servicio (PaaS) en Azure. Debes desplegar un entorno de Azure que cumpla el plan de migración de la empresa.\nSolución: Creas un Azure App Service y máquinas virtuales de Azure con Microsoft SQL Server instalado.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Las VM son IaaS, no PaaS.", "multi": false, "exp": ["Sí: las VM con SQL Server instalado son IaaS, no PaaS.", "No: incluye VM (IaaS), así que no cumple solo-PaaS."]}, {"n": 43, "kind": "mc", "qEn": "Your company plans to migrate all its data and resources to Azure.\nThe company's migration plan states that only Platform as a Service (PaaS) solutions must be used in Azure.\nYou need to deploy an Azure environment that meets the company migration plan.\nSolution: You create an Azure App Service and Azure Storage accounts.\nDoes this meet the goal?", "qEs": "Tu empresa planea migrar todos sus datos y recursos a Azure. El plan de migración establece que solo se deben usar soluciones de Plataforma como Servicio (PaaS) en Azure. Debes desplegar un entorno de Azure que cumpla el plan de migración de la empresa.\nSolución: Creas un Azure App Service y cuentas de Azure Storage.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "⚠ Discutida: depende de si el examen considera Storage como PaaS. La clave dice No. Confírmala con tu profe.", "multi": false, "disputed": true, "exp": ["Sí: según la clave, las cuentas de Storage no se consideran PaaS en este examen (pregunta discutida).", "No: es la respuesta de la clave."]}, {"n": 44, "kind": "mc", "qEn": "Your company hosts an accounting application named App1 that is used by all the customers of the company.\nApp1 has low usage during the first three weeks of each month and very high usage during the last week of each month.\nWhich benefit of Azure Cloud Services supports cost management for this type of usage pattern?", "qEs": "Tu empresa aloja una aplicación de contabilidad llamada App1, usada por todos los clientes. App1 tiene poco uso las tres primeras semanas de cada mes y un uso muy alto la última semana. ¿Qué ventaja de los servicios en la nube de Azure ayuda a gestionar los costes con este patrón de uso?", "oEn": ["high availability", "high latency", "elasticity", "load balancing"], "oEs": ["alta disponibilidad", "alta latencia", "elasticidad", "balanceo de carga"], "ans": [2], "why": "Elasticidad: los recursos suben y bajan según la demanda, y pagas solo lo usado.", "multi": false, "exp": ["Alta disponibilidad: que el servicio no se caiga, no ahorra costes por picos.", "Alta latencia: es algo negativo (respuestas lentas).", "Elasticidad: los recursos suben en la semana de mucho uso y bajan el resto, pagando solo lo usado. Correcta.", "Balanceo de carga: reparte tráfico, no ajusta el coste."]}, {"n": 45, "kind": "mc", "qEn": "You plan to migrate a web application to Azure. The web application is accessed by external users.\nYou need to recommend a cloud deployment solution to minimize the amount of administrative effort used to manage the web application.\nWhat should you include in the recommendation?", "qEs": "Planeas migrar una aplicación web a Azure. Usuarios externos acceden a ella. Debes recomendar una solución de despliegue en la nube que minimice el esfuerzo administrativo para gestionar la aplicación web. ¿Qué debes incluir?", "oEn": ["Software as a Service (SaaS)", "Platform as a Service (PaaS)", "Infrastructure as a Service (IaaS)", "Database as a Service (DaaS)"], "oEs": ["Software como Servicio (SaaS)", "Plataforma como Servicio (PaaS)", "Infraestructura como Servicio (IaaS)", "Base de datos como Servicio (DaaS)"], "ans": [1], "why": "PaaS: Azure gestiona SO y servidores; tú solo gestionas la aplicación.", "multi": false, "exp": ["SaaS: es software ya hecho; aquí hay que migrar tu propia aplicación web.", "PaaS: Azure gestiona SO y servidores; tú solo la aplicación. Mínimo esfuerzo. Correcta.", "IaaS: tendrías que gestionar el SO y los servidores.", "DaaS: se refiere a bases de datos, no a aplicaciones web."]}, {"n": 46, "kind": "match", "qEn": "Which cloud deployment solution is used for Azure virtual machines and Azure SQL databases?", "qEs": "¿Qué modelo de servicio en la nube se usa para las máquinas virtuales de Azure y las bases de datos Azure SQL?", "rows": [{"en": "Azure virtual machines", "es": "Máquinas virtuales de Azure", "aEn": "IaaS", "aEs": "IaaS"}, {"en": "Azure SQL databases", "es": "Bases de datos Azure SQL", "aEn": "PaaS", "aEs": "PaaS"}], "pool": ["IaaS", "PaaS", "SaaS"], "why": "Las VM son IaaS; Azure SQL Database es un servicio gestionado (PaaS).", "exp": ["Las VM son IaaS: tú gestionas el sistema operativo.", "Azure SQL Database es PaaS: Azure gestiona servidor y actualizaciones."]}, {"n": 47, "kind": "mc", "qEn": "You have an on-premises network that contains 100 servers.\nYou need to recommend a solution that provides additional resources to your users. The solution must minimize capital and operational expenditure costs.\nWhat should you include in the recommendation?", "qEs": "Tienes una red local con 100 servidores. Debes recomendar una solución que dé recursos adicionales a tus usuarios. La solución debe minimizar los costes de capital y operativos. ¿Qué debes incluir?", "oEn": ["a complete migration to the public cloud", "an additional data center", "a private cloud", "a hybrid cloud"], "oEs": ["una migración completa a la nube pública", "un centro de datos adicional", "una nube privada", "una nube híbrida"], "ans": [3], "why": "Nube híbrida: mantienes lo local y amplías con la nube pública sin comprar más hardware.", "multi": false, "exp": ["Migración completa a la nube pública: no es lo que se pide (ampliar recursos).", "Centro de datos adicional: exige gasto de capital y operativo.", "Nube privada: también requiere inversión propia.", "Nube híbrida: mantienes lo local y amplías con la nube pública sin comprar hardware. Correcta."]}, {"n": 48, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "In a hybrid cloud, a company must always migrate from a private cloud to a public cloud.", "es": "En una nube híbrida, una empresa debe migrar siempre de una nube privada a una nube pública.", "yes": false}, {"en": "A company can extend the capacity of its internal network by using the public cloud.", "es": "Una empresa puede ampliar la capacidad de su red interna usando la nube pública.", "yes": true}, {"en": "In the public cloud, only guest users can access the resources.", "es": "En la nube pública, solo los usuarios invitados pueden acceder a los recursos.", "yes": false}], "why": "Híbrida = local + pública; no obliga a migrar todo.", "exp": ["La híbrida no obliga a migrar todo de una nube a otra. No.", "La híbrida permite ampliar la capacidad local con la nube pública. Sí.", "En la nube pública acceden los usuarios autorizados, no solo invitados. No."]}, {"n": 49, "kind": "mc", "qEn": "You plan to migrate several servers from an on-premises network to Azure.\nWhat is an advantage of using a public cloud service for the servers over an on-premises network?", "qEs": "Planeas migrar varios servidores de una red local a Azure. ¿Cuál es una ventaja de usar un servicio de nube pública frente a una red local?", "oEn": ["The public cloud is owned by the public, NOT a private corporation", "The public cloud is a crowd-sourcing solution that provides corporations with the ability to enhance the cloud", "All public cloud resources can be freely accessed by every member of the public", "The public cloud is a shared entity whereby multiple corporations each use a portion of the resources in the cloud"], "oEs": ["La nube pública es propiedad del público, NO de una empresa privada", "La nube pública es una solución colaborativa (crowdsourcing) que permite a las empresas mejorar la nube", "Todos los recursos de la nube pública son accesibles libremente por cualquier persona", "La nube pública es una entidad compartida en la que varias empresas usan cada una una parte de los recursos"], "ans": [3], "why": "Nube pública = recursos compartidos entre muchos clientes (multi-tenant), con la propiedad de un proveedor.", "multi": false, "exp": ["La nube pública es de un proveedor privado, no «del público».", "No es crowdsourcing: la mantiene el proveedor.", "No es de acceso libre: hay que autenticarse.", "Varias empresas comparten la misma infraestructura (multi-inquilino). Correcta."]}, {"n": 50, "kind": "mc", "qEn": "Azure Site Recovery provides ____ for virtual machines.", "qEs": "Azure Site Recovery ofrece ____ para máquinas virtuales.", "oEn": ["fault tolerance", "disaster recovery", "elasticity", "high availability"], "oEs": ["tolerancia a fallos", "recuperación ante desastres", "elasticidad", "alta disponibilidad"], "ans": [1], "why": "Site Recovery replica las VM a otra región para recuperarlas tras un desastre.", "multi": false, "exp": ["Tolerancia a fallos: mantener el servicio sin interrupción; Site Recovery recupera tras el fallo.", "Site Recovery replica las VM a otra región para recuperarlas tras un desastre. Correcta.", "Elasticidad: ajustar recursos según la demanda.", "Alta disponibilidad: evitar caídas; Site Recovery recupera, no evita."]}, {"n": 51, "kind": "mc", "qEn": "In which type of cloud model are all the hardware resources owned by a third-party and shared between multiple tenants?", "qEs": "¿En qué tipo de modelo de nube todo el hardware es propiedad de un tercero y se comparte entre varios inquilinos (tenants)?", "oEn": ["private", "hybrid", "public"], "oEs": ["privada", "híbrida", "pública"], "ans": [2], "why": "Nube pública: hardware de un tercero (p. ej., Microsoft) compartido entre varios clientes.", "multi": false, "exp": ["Nube privada: el hardware es tuyo.", "Nube híbrida: mezcla de privada y pública.", "Nube pública: hardware de un tercero compartido entre varios clientes. Correcta."]}, {"n": 52, "kind": "mc", "qEn": "____ is a desktop and application virtualization service that enables use of cloud-hosted Windows from any location.", "qEs": "____ es un servicio de virtualización de escritorios y aplicaciones que permite usar Windows alojado en la nube desde cualquier lugar.", "oEn": ["An availability set", "Azure Spot VMs", "Azure Virtual Desktop", "Azure VM Scale Sets"], "oEs": ["Un conjunto de disponibilidad", "Azure Spot VMs", "Azure Virtual Desktop", "Azure VM Scale Sets"], "ans": [2], "why": "Azure Virtual Desktop = escritorios Windows en la nube.", "multi": false, "exp": ["Conjunto de disponibilidad: agrupa VM para evitar caídas, no virtualiza escritorios.", "Spot VMs: VM baratas e interrumpibles.", "Azure Virtual Desktop: escritorios y aplicaciones Windows en la nube. Correcta.", "VM Scale Sets: grupos de VM que escalan, no escritorios."]}, {"n": 53, "kind": "mc", "qEn": "You have 1,000 virtual machines hosted on the Hyper-V hosts in a data center.\nYou plan to migrate all the virtual machines to an Azure pay-as-you-go subscription.\nYou need to identify which expenditure model to use for the planned Azure solution.\nWhich expenditure model should you identify?", "qEs": "Tienes 1.000 máquinas virtuales alojadas en hosts Hyper-V de un centro de datos. Planeas migrarlas todas a una suscripción de Azure de pago por uso. Debes identificar qué modelo de gasto usar. ¿Cuál?", "oEn": ["operational", "elastic", "capital", "scalable"], "oEs": ["operativo (OpEx)", "elástico", "de capital (CapEx)", "escalable"], "ans": [0], "why": "Pago por uso = gasto operativo (OpEx).", "multi": false, "exp": ["OpEx: pago por uso, sin inversión inicial. Correcta.", "Elástico: no es un modelo de gasto, es una capacidad.", "CapEx: es comprar hardware por adelantado.", "Escalable: no es un modelo de gasto."]}, {"n": 54, "kind": "match", "qEn": "Match the Azure services benefits to the correct descriptions.", "qEs": "Relaciona los beneficios de los servicios de Azure con la descripción correcta.", "rows": [{"en": "A service that remains available after a failure.", "es": "Un servicio que sigue disponible tras un fallo.", "aEn": "Fault tolerance", "aEs": "Tolerancia a fallos"}, {"en": "A service that can be recovered after a failure.", "es": "Un servicio que se puede recuperar tras un fallo.", "aEn": "Disaster recovery", "aEs": "Recuperación ante desastres"}, {"en": "A service that performs quickly when demand increases.", "es": "Un servicio que responde rápido cuando aumenta la demanda.", "aEn": "Dynamic scalability", "aEs": "Escalabilidad dinámica"}, {"en": "A service that can be accessed quickly from the Internet.", "es": "Un servicio al que se accede rápidamente desde Internet.", "aEn": "Low latency", "aEs": "Baja latencia"}], "pool": ["Disaster recovery", "Fault tolerance", "Low latency", "Dynamic scalability"], "why": "Cada beneficio describe una propiedad distinta.", "exp": ["Tolerancia a fallos: el servicio sigue disponible aunque algo falle.", "Recuperación ante desastres: restaurar el servicio tras un fallo.", "Escalabilidad dinámica: responde rápido al aumentar la demanda.", "Baja latencia: acceso rápido desde Internet."]}, {"n": 55, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "To implement a hybrid cloud, a company must have an internal network.", "es": "Para implementar una nube híbrida, una empresa debe tener una red interna.", "yes": true}, {"en": "A company can extend the computing resources of its internal network by using a hybrid cloud.", "es": "Una empresa puede ampliar los recursos de cómputo de su red interna usando una nube híbrida.", "yes": true}, {"en": "In the public cloud, only guest users can access the resources.", "es": "En la nube pública, solo los usuarios invitados pueden acceder a los recursos.", "yes": false}], "why": "Híbrida = tu red interna + nube pública.", "exp": ["Una híbrida combina red interna y nube, así que hace falta una red interna. Sí.", "Amplías los recursos de tu red interna con la nube. Sí.", "En la nube pública no solo acceden invitados. No."]}, {"n": 56, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "PaaS provides full control of the operating system that hosts apps.", "es": "PaaS da control total del sistema operativo que aloja las aplicaciones.", "yes": false}, {"en": "PaaS provides additional memory to apps by changing pricing tiers.", "es": "PaaS da más memoria a las aplicaciones cambiando de nivel de precios.", "yes": true}, {"en": "PaaS can automatically scale the number of instances.", "es": "PaaS pue , 2], "why": "En IaaS Microsoft se encarga del hardware y de la seguridad física; tú sigues con SO, datos y permisos.", "multi": true, "exp": ["Reemplazar hardware averiado: lo hace Microsoft en Azure. Se elimina.", "Copias de seguridad de datos: siguen siendo tu responsabilidad.", "Seguridad física: la gestiona Microsoft. Se elimina.", "Actualizar el SO: en una VM (IaaS) sigues haciéndolo tú.", "Permisos de documentos compartidos: siguen siendo tuyos."]}, {"n": 58, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "Azure pay-as-you-go pricing is an example of capital expenditure (CapEx).", "es": "El precio de pago por uso de Azure es un ejemplo de gasto de capital (CapEx).", "yes": false}, {"en": "Paying for electricity for your datacenter is an example of operational expenditure (OpEx).", "es": "Pagar la electricidad de tu centro de datos es un ejemplo de gasto operativo (OpEx).", "yes": true}, {"en": "Deploying your own datacenter is an example of CapEx.", "es": "Desplegar tu propio centro de datos es un ejemplo de CapEx.", "yes": true}], "why": "CapEx = inversión inicial; OpEx = gasto continuo.", "exp": ["Pago por uso no es CapEx (compra inicial). No.", "La electricidad es un gasto recurrente: OpEx. Sí.", "Montar tu centro de datos es una inversión inicial: CapEx. Sí."]}, {"n": 59, "kind": "mc", "qEn": "You plan to provision Infrastructure as a Service (IaaS) resources in Azure.\nWhich resource is an example of IaaS?", "qEs": "Planeas aprovisionar recursos de Infraestructura como Servicio (IaaS) en Azure. ¿Qué recurso es un ejemplo de IaaS?", "oEn": ["an Azure web app", "an Azure virtual machine", "an Azure logic app", "an Azure SQL database"], "oEs": ["una aplicación web de Azure (web app)", "una máquina virtual de Azure", "una aplicación lógica de Azure (logic app)", "una base de datos Azure SQL"], "ans": [1], "why": "  that hosts the apps.", "es": "Las aplicaciones web PaaS dan control total del sistema operativo.", "yes": false}, {"en": "PaaS web apps can get additional memory by changing the pricing tier.", "es": "Las aplicaciones web PaaS pueden obtener más memoria cambiando el nivel de precios.", "yes": true}, {"en": "PaaS web apps can be configured to automatically scale the number of instances based on demand.", "es": "Las aplicaciones web PaaS pueden escalar automáticamente el número de instancias según la demanda.", "yes": true}], "why": "PaaS: sin control del SO, pero con autoescalado.", "exp": ["PaaS no da control del SO. No.", "Cambiando de nivel de precios hay más memoria. Sí.", "PaaS autoescala según la demanda. Sí."]}, {"n": 65, "kind": "mc", "qEn": "Your company plans to migrate all its data and resources to Azure.\nThe company's migration plan states that only Platform as a Service (PaaS) solutions must be used in Azure.\nYou need to deploy an Azure environment that meets the company migration plan.\nSolution: You create Azure virtual machines, Azure SQL databases, and Azure Storage accounts.\nDoes this meet the goal?", "qEs": "Tu empresa planea migrar todos sus datos y recursos a Azure. El plan de migración establece que solo se deben usar soluciones de Plataforma como Servicio (PaaS) en Azure. Debes desplegar un entorno de Azure que cumpla el plan de migración de la empresa.\nSolución: Creas máquinas virtuales de Azure, bases de datos Azure SQL y cuentas de Azure Storage.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Las VM son IaaS, no PaaS.", "multi": false, "exp": ["Sí: incluye VM, que son IaaS.", "No: las VM no son PaaS, así que no cumple."]}, {"n": 66, "kind": "mc", "qEn": "Your company plans to deploy several custom applications to Azure. The applications will provide invoicing services to the customers of the company. Each application will have several prerequisite applications and services installed.\nYou need to recommend a cloud deployment solution for all the applications.\nWhat should you recommend?", "qEs": "Tu empresa planea desplegar varias aplicaciones personalizadas en Azure para ofrecer servicios de facturación a sus clientes. Cada aplicación tendrá instalados varios requisitos previos (aplicaciones y servicios). Debes recomendar una solución de despliegue en la nube para todas las aplicaciones. ¿Qué recomiendas?", "oEn": ["Software as a Service (SaaS)", "Platform as a Service (PaaS)", "Infrastructure as a Service (laaS)"], "oEs": ["Software como Servicio (SaaS)", "Plataforma como Servicio (PaaS)", "Infraestructura como Servicio (IaaS)"], "ans": [2], "why": "Si necesitas instalar prerrequisitos y controlar el entorno, necesitas IaaS (VM).", "multi": false, "exp": ["SaaS: software ya hecho.", "PaaS: no permite instalar requisitos previos propios.", "IaaS: controlas el SO y puedes instalar lo que necesites. Correcta."]}, {"n": 67, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "Building a data center infrastructure is an example of OpEx.", "es": "Construir la infraestructura de un centro de datos es un ejemplo de OpEx.", "yes": false}, {"en": "Monthly salaries for technical personnel are an example of OpEx.", "es": "Los salarios mensuales del personal técnico son un ejemplo de OpEx.", "yes": true}, {"en": "Leasing software is an example of OpEx.", "es": "Alquilar software es un ejemplo de OpEx.", "yes": true}], "why": "Construir = CapEx. Gastos recurrentes = OpEx.", "exp": ["Construir un centro de datos es CapEx. No.", "Los salarios mensuales son un gasto recurrente: OpEx. Sí.", "Alquilar software es gasto recurrente: OpEx. Sí."]}, {"n": 68, "kind": "mc", "qEn": "Azure Cosmos DB is an example of a ____ offering.", "qEs": "Azure Cosmos DB es un ejemplo de oferta de ____.", "oEn": ["platform as a service (PaaS)",
