uede contener recursos de varias regiones de Azure.", "yes": true}], "why": "Los grupos de recursos no se anidan; cada recurso está en uno solo, pero pueden mezclar regiones.", "exp": ["No se pueden anidar grupos de recursos. No.", "Un recurso pertenece a un solo grupo de recursos. No.", "Un grupo puede mezclar regiones. Sí."]}, {"n": 71, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "Microsoft SQL Server 2019 installed on an Azure virtual machine is an example of PaaS.", "es": "Microsoft SQL Server 2019 instalado en una VM de Azure es un ejemplo de PaaS.", "yes": false}, {"en": "Azure SQL Database is an example of PaaS.", "es": "Azure SQL Database es un ejemplo de PaaS.", "yes": true}, {"en": "Azure Cosmos DB is an example of SaaS.", "es": "Azure Cosmos DB es un ejemplo de SaaS.", "yes": false}], "why": "SQL en una VM = IaaS.", "exp": ["SQL Server en una VM es IaaS. No.", "Azure SQL Database es PaaS. Sí.", "Cosmos DB es PaaS, no SaaS. No."]}, {"n": 72, "kind": "mc", "qEn": "You can assign a ____ to every Azure resource.", "qEs": "Puedes asignar un/una ____ a cada recurso de Azure.", "oEn": ["blueprint", "lock", "policy", "service endpoint"], "oEs": ["blueprint (plano)", "bloqueo (lock)", "directiva (policy)", "punto de conexión de servicio (service endpoint)"], "ans": [1], "why": "Un bloqueo (lock) puede aplicarse a cualquier recurso para evitar borrados o cambios.", "multi": false, "exp": ["Blueprint: se asigna a suscripciones, no a cada recurso.", "Bloqueo (lock): se puede aplicar a cualquier recurso para evitar cambios o borrados. Correcta.", "Directiva: se asigna a ámbitos como suscripciones o grupos de recursos.", "Punto de conexión de servicio: se configura en subredes."]}, {"n": 73, "kind": "mc", "qEn": "Your company plans to migrate all its data and resources to Azure.\nThe company's migration plan states that only Platform as a Service (PaaS) solutions must be used in Azure.\nYou need to deploy an Azure environment that meets the company's migration plan.\nWhat should you create?", "qEs": "Tu empresa planea migrar todos sus datos y recursos a Azure. El plan de migración establece que solo se deben usar soluciones PaaS. Debes desplegar un entorno de Azure que cumpla el plan. ¿Qué debes crear?", "oEn": ["Azure virtual machines, Azure SQL databases, and Azure Storage accounts.", "an Azure App Service and Azure virtual machines that have Microsoft SQL Server installed.", "an Azure App Service and Azure SQL databases.", "Azure storage accounts and web server in Azure virtual machines."], "oEs": ["Máquinas virtuales de Azure, bases de datos Azure SQL y cuentas de Azure Storage.", "Un Azure App Service y máquinas virtuales de Azure con Microsoft SQL Server instalado.", "Un Azure App Service y bases de datos Azure SQL.", "Cuentas de Azure Storage y un servidor web en máquinas virtuales de Azure."], "ans": [2], "why": "Solo la opción C usa únicamente servicios PaaS (las otras incluyen VM = IaaS).", "multi": false, "exp": ["Incluye VM (IaaS).", "Incluye VM (IaaS).", "App Service y Azure SQL son solo PaaS. Correcta.", "Incluye VM (IaaS)."]}, {"n": 74, "kind": "mc", "qEn": "What does a customer provide in a software as a service (SaaS) model?", "qEs": "¿Qué aporta el cliente en un modelo de Software como Servicio (SaaS)?", "oEn": ["application data", "data storage", "compute resources", "application software"], "oEs": ["los datos de la aplicación", "el almacenamiento de datos", "los recursos de cómputo", "el software de la aplicación"], "ans": [0], "why": "En SaaS el proveedor pone todo; el cliente solo aporta sus datos.", "multi": false, "exp": ["En SaaS el cliente aporta sus datos. Correcta.", "El almacenamiento lo pone el proveedor.", "El cómputo lo pone el proveedor.", "El software lo pone el proveedor."]}, {"n": 75, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "Azure Files is an example of IaaS.", "es": "Azure Files es un ejemplo de IaaS.", "yes": false}, {"en": "A DNS server that runs on an Azure virtual machine is an example of PaaS.", "es": "Un servidor DNS que se ejecuta en una VM de Azure es un ejemplo de PaaS.", "yes": false}, {"en": "Microsoft Intune is an example of SaaS.", "es": "Microsoft Intune es un ejemplo de SaaS.", "yes": true}], "why": "Una VM siempre implica IaaS.", "exp": ["Azure Files es un servicio gestionado, no IaaS. No.", "Un servidor DNS en una VM es IaaS. No.", "Intune es SaaS. Sí."]}, {"n": 76, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "Cloud computing provides elastic scalability.", "es": "La computación en la nube ofrece escalabilidad elástica.", "yes": true}, {"en": "Customers can minimize CapEx by using a public cloud.", "es": "Los clientes pueden minimizar el CapEx usando una nube pública.", "yes": true}, {"en": "Cloud computing leverages virtualization to provide services to multiple customers simultaneously.", "es": "La computación en la nube usa la virtualización para dar servicio a varios clientes a la vez.", "yes": true}], "why": "Las tres son ciertas.", "exp": ["La nube ofrece escalabilidad elástica. Sí.", "Con la nube pública se reduce el CapEx. Sí.", "La virtualización permite compartir infraestructura entre clientes. Sí."]}, {"n": 77, "kind": "mc", "qEn": "What is the first stage in the Microsoft Cloud Adoption Framework for Azure?", "qEs": "¿Cuál es la primera fase del Marco de Adopción de la Nube de Microsoft para Azure (Cloud Adoption Framework)?", "oEn": ["Adopt the cloud.", "Make a plan.", "Ready your organization.", "Define your strategy."], "oEs": ["Adoptar la nube.", "Hacer un plan.", "Preparar tu organización.", "Definir tu estrategia."], "ans": [3], "why": "Orden: Definir estrategia → Planificar → Prepararse → Adoptar → Gobernar y Gestionar.", "multi": false, "exp": ["Adoptar: es una fase posterior.", "Hacer un plan: es la segunda fase.", "Preparar la organización: es la tercera fase.", "Definir tu estrategia: es la primera fase. Correcta."]}, {"n": 78, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "A company can extend its internal network by adding its own physical servers to the public cloud.", "es": "Una empresa puede ampliar su red interna añadiendo sus propios servidores físicos a la nube pública.", "yes": false}, {"en": "A private cloud must be disconnected from the Internet.", "es": "Una nube privada debe estar desconectada de Internet.", "yes": false}, {"en": "A part of a hybrid cloud is the public cloud.", "es": "Una parte de una nube híbrida es la nube pública.", "yes": true}], "why": "Híbrida = privada/local + pública.", "exp": ["No puedes añadir tus servidores físicos a la nube pública. No.", "Una nube privada puede tener conexión a Internet. No.", "Una híbrida incluye la nube pública. Sí."]}, {"n": 79, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "You must have physical servers to use cloud computing.", "es": "Debes tener servidores físicos para usar la computación en la nube.", "yes": false}, {"en": "You must have Internet connectivity to use cloud computing.", "es": "Debes tener conexión a Internet para usar la computación en la nube.", "yes": false}, {"en": "The costs to increase cloud capacity are less than the costs to increase on-premises datacenter capacity.", "es": "Los costes de aumentar la capacidad en la nube son menores que los de aumentar la de un centro de datos local.", "yes": true}], "why": "Se puede usar la nube con conexiones privadas; ampliar en la nube es más barato.", "exp": ["No hacen falta servidores físicos propios. No.", "Se puede usar con conexiones privadas, sin Internet. No.", "Ampliar en la nube es más barato que ampliar un centro de datos. Sí."]}, {"n": 80, "kind": "match", "qEn": "Match the cloud computing benefits to the correct descriptions.", "qEs": "Relaciona los beneficios de la computación en la nube con las descripciones correctas.", "rows": [{"en": "Resources can be provisioned dynamically to meet changing demands.", "es": "Los recursos se pueden aprovisionar dinámicamente para cubrir demandas cambiantes.", "aEn": "Scalability", "aEs": "Escalabilidad"}, {"en": "Applications and data can be deployed to multiple regions.", "es": "Las aplicaciones y los datos se pueden desplegar en varias regiones.", "aEn": "Geo-distribution", "aEs": "Distribución geográfica"}, {"en": "Applications can be developed, tested and launched rapidly.", "es": "Las aplicaciones se pueden desarrollar, probar y lanzar rápidamente.", "aEn": "Agility", "aEs": "Agilidad"}], "pool": ["Agility", "Geo-distribution", "Scalability"], "why": "Escalabilidad = demanda; geo-distribución = regiones; agilidad = rapidez.", "exp": ["Escalabilidad: aprovisionar recursos según la demanda.", "Distribución geográfica: desplegar en varias regiones.", "Agilidad: desarrollar y lanzar rápido."]}, {"n": 81, "kind": "mc", "qEn": "Azure Site Recovery provides ____ for virtual machines.", "qEs": "Azure Site Recovery ofrece ____ para máquinas virtuales.", "oEn": ["fault tolerance", "disaster recovery", "elasticity", "high availability"], "oEs": ["tolerancia a fallos", "recuperación ante desastres", "elasticidad", "alta disponibilidad"], "ans": [1], "why": "Igual que la pregunta 50.", "multi": false, "exp": ["Tolerancia a fallos: seguir funcionando durante el fallo.", "Site Recovery: recuperación ante desastres. Correcta.", "Elasticidad: ajustar a la demanda.", "Alta disponibilidad: evitar caídas."]}, {"n": 82, "kind": "match", "qEn": "You plan to use Azure to host two apps named App1 and App2. ✑ You must be able to modify the code of App1. ✑ Administrative effort to manage the operating system of App1 must be minimized. ✑ App2 must run interactively with the operating system of the server. Which type of cloud service should you use for each app?", "qEs": "Planeas usar Azure para alojar dos aplicaciones, App1 y App2. ✑ Debes poder modificar el código de App1. ✑ Debe minimizarse el esfuerzo administrativo de gestionar el sistema operativo de App1. ✑ App2 debe ejecutarse de forma interactiva con el sistema operativo del servidor. ¿Qué tipo de servicio en la nube debes usar para cada aplicación?", "rows": [{"en": "App1", "es": "App1", "aEn": "PaaS", "aEs": "PaaS"}, {"en": "App2", "es": "App2", "aEn": "IaaS", "aEs": "IaaS"}], "pool": ["IaaS", "PaaS", "SaaS"], "why": "App1: modificar código sin gestionar el SO = PaaS. App2: acceso al SO = IaaS.", "exp": ["App1: modificas el código sin gestionar el SO: PaaS.", "App2: necesita acceso al sistema operativo: IaaS."]}, {"n": 83, "kind": "mc", "qEn": "You have an accounting application named App1 that uses a legacy database.\nYou plan to move App1 to the cloud.\nWhich service model should you use?", "qEs": "Tienes una aplicación de contabilidad llamada App1 que usa una base de datos heredada (legacy). Planeas llevar App1 a la nube. ¿Qué modelo de servicio debes usar?", "oEn": ["platform as a service (PaaS)", "infrastructure as a service (IaaS)", "software as a service (SaaS)"], "oEs": ["Plataforma como Servicio (PaaS)", "Infraestructura como Servicio (IaaS)", "Software como Servicio (SaaS)"], "ans": [1], "why": "Una base de datos heredada suele requerir control total del SO: IaaS.", "multi": false, "exp": ["PaaS: una base de datos heredada suele exigir control del SO.", "IaaS: control total del SO para la base de datos heredada. Correcta.", "SaaS: no permite instalar tu propia aplicación."]}, {"n": 84, "kind": "mc", "qEn": "Microsoft 365 is an example of which cloud service model?", "qEs": "Microsoft 365 es un ejemplo de ¿qué modelo de servicio en la nube?", "oEn": ["infrastructure as a service (IaaS)", "platform as a service (PaaS)", "software as a service (SaaS)"], "oEs": ["Infraestructura como Servicio (IaaS)", "Plataforma como Servicio (PaaS)", "Software como Servicio (SaaS)"], "ans": [2], "why": "Microsoft 365 es software listo para usar: SaaS.", "multi": false, "exp": ["No es IaaS: no gestionas servidores.", "No es PaaS: no desarrollas sobre una plataforma.", "Microsoft 365 es software listo para usar: SaaS. Correcta."]}, {"n": 85, "kind": "mc", "qEn": "An Azure web app that queries an on-premises Microsoft SQL Server database is an example of a ____ cloud.", "qEs": "Una aplicación web de Azure que consulta una base de datos Microsoft SQL Server local es un ejemplo de nube ____.", "oEn": ["hybrid", "multi-vendor", "private", "public"], "oEs": ["híbrida", "multiproveedor", "privada", "pública"], "ans": [0], "why": "Mezcla de nube y local = híbrida.", "multi": false, "exp": ["Híbrida: mezcla recursos en la nube con recursos locales. Correcta.", "Multiproveedor: usa nubes de varios proveedores.", "Privada: todo local.", "Pública: todo en la nube."]}, {"n": 86, "kind": "mc", "qEn": "A Microsoft SQL Server database hosted in the cloud and has software updates managed by Azure is an example of ____.", "qEs": "Una base de datos Microsoft SQL Server alojada en la nube, con las actualizaciones de software gestionadas por Azure, es un ejemplo de ____.", "oEn": ["DRaaS", "IaaS", "PaaS", "SaaS"], "oEs": ["DRaaS", "IaaS", "PaaS", "SaaS"], "ans": [2], "why": "Azure gestiona las actualizaciones: PaaS.", "multi": false, "exp": ["DRaaS: recuperación ante desastres como servicio, no es una base de datos.", "IaaS: tendrías que actualizar tú el software.", "PaaS: Azure gestiona el servidor y sus actualizaciones. Correcta.", "SaaS: es software final, no una base de datos para desarrolladores."]}, {"n": 87, "kind": "mc", "qEn": "Which cloud computing model includes on-premises and cloud-based resources?", "qEs": "¿Qué modelo de computación en la nube incluye recursos locales y recursos en la nube?", "oEn": ["hybrid", "public", "private"], "oEs": ["híbrido", "público", "privado"], "ans": [0], "why": "Híbrido = local + nube.", "multi": false, "exp": ["Híbrido: mezcla recursos locales y en la nube. Correcto.", "Público: todo en la nube del proveedor.", "Privado: todo en infraestructura propia."]}, {"n": 88, "kind": "mc", "qEn": "Autoscaling is an example of ____.", "qEs": "El autoescalado es un ejemplo de ____.", "oEn": ["agility", "elasticity", "geo-distribution", "predictability"], "oEs": ["agilidad", "elasticidad", "distribución geográfica", "previsibilidad"], "ans": [1], "why": "Elasticidad = ajustar recursos automáticamente a la demanda.", "multi": false, "exp": ["Agilidad: lanzar y cambiar rápido.", "Elasticidad: los recursos suben y bajan automáticamente con la demanda. Correcta.", "Distribución geográfica: desplegar en varias regiones.", "Previsibilidad: saber el coste o rendimiento esperado."]}, {"n": 89, "kind": "mc", "qEn": "____ supports synchronization between on-premises storage and Azure Storage.", "qEs": "____ admite la sincronización entre el almacenamiento local y Azure Storage.", "oEn": ["Azure Blob Storage", "Azure Files", "Azure Queue Storage", "Azure Table Storage"], "oEs": ["Azure Blob Storage", "Azure Files", "Azure Queue Storage", "Azure Table Storage"], "ans": [1], "why": "Azure File Sync sincroniza servidores de archivos locales con Azure Files.", "multi": false, "exp": ["Blob Storage: guarda objetos grandes, no sincroniza con servidores de archivos locales.", "Azure Files (con Azure File Sync) sincroniza con servidores locales. Correcta.", "Queue Storage: guarda mensajes.", "Table Storage: guarda datos no relacionales."]}, {"n": 90, "kind": "mc", "qEn": "Which term represents the ability to increase the computing capacity of a virtual machine by adding memory or CPUs?", "qEs": "¿Qué término representa la capacidad de aumentar la capacidad de cómputo de una máquina virtual añadiendo memoria o CPU?", "oEn": ["agility", "vertical scaling", "horizontal scaling", "elasticity"], "oEs": ["agilidad", "escalado vertical (vertical scaling)", "escalado horizontal (horizontal scaling)", "elasticidad"], "ans": [1], "why": "Vertical = hacer más grande la misma máquina. Horizontal = añadir más máquinas.", "multi": false, "exp": ["Agilidad: rapidez para lanzar.", "Escalado vertical: hacer más grande una misma máquina (más CPU o memoria). Correcta.", "Escalado horizontal: añadir más máquinas.", "Elasticidad: ajustar recursos a la demanda automáticamente."]}, {"n": 91, "kind": "mc", "qEn": "What are two benefits of cloud computing? Each correct answer presents a complete solution.", "qEs": "¿Cuáles son dos beneficios de la computación en la nube? Cada respuesta correcta presenta una solución completa.", "oEn": ["enables the rapid provisioning of resources", "has increased administrative complexity", "has the same configuration options as on-premises", "shifts capital expenditures (CAPEX) to operating expenditures (OPEX)"], "oEs": ["permite aprovisionar recursos rápidamente", "tiene mayor complejidad administrativa", "tiene las mismas opciones de configuración que lo local", "traslada el gasto de capital (CAPEX) a gasto operativo (OPEX)"], "ans": [0, 3], "why": "Rapidez de aprovisionamiento y paso de CapEx a OpEx son ventajas clásicas de la nube.", "multi": true, "exp": ["Aprovisionar recursos rápidamente: es un beneficio. Correcta.", "Mayor complejidad administrativa: no es un beneficio, la nube la reduce.", "Mismas opciones que lo local: no es un beneficio concreto.", "De CapEx a OpEx: se paga por uso. Correcta."]}, {"n": 92, "kind": "mc", "qEn": "What is a feature of an Azure virtual network?", "qEs": "¿Cuál es una característica de una red virtual de Azure?", "oEn": ["resource cost analysis", "packet inspection", "geo-redundancy", "isolation and segmentation"], "oEs": ["análisis de costes de recursos", "inspección de paquetes", "geo-redundancia", "aislamiento y segmentación"], "ans": [3], "why": "Las VNet aíslan y segmentan los recursos.", "multi": false, "exp": ["Análisis de costes: lo hace Cost Management.", "Inspección de paquetes: la hace un firewall.", "Geo-redundancia: es de Storage.", "Aislamiento y segmentación: las VNet aíslan y segmentan recursos. Correcta."]}, {"n": 93, "kind": "mc", "qEn": "____ enables Azure resources to be deployed close to users.", "qEs": "____ permite desplegar recursos de Azure cerca de los usuarios.", "oEn": ["Elasticity", "Geo-distribution", "High availability", "Scalability"], "oEs": ["La elasticidad", "La distribución geográfica", "La alta disponibilidad", "La escalabilidad"], "ans": [1], "why": "Geo-distribución = usar regiones cercanas a los usuarios.", "multi": false, "exp": ["Elasticidad: ajustar a la demanda.", "Distribución geográfica: desplegar en regiones cercanas a los usuarios. Correcta.", "Alta disponibilidad: evitar caídas.", "Escalabilidad: crecer en capacidad."]}, {"n": 94, "kind": "match", "qEn": "Match the cloud computing benefits to the appropriate descriptions.", "qEs": "Relaciona los beneficios de la computación en la nube con las descripciones adecuadas.", "rows": [{"en": "Increase the compute capacity of apps in the cloud", "es": "Aumentar la capacidad de cómputo de las aplicaciones en la nube", "aEn": "Scalability", "aEs": "Escalabilidad"}, {"en": "Provide a continuous user experience with no apparent downtime", "es": "Dar una experiencia continua al usuario sin caídas aparentes", "aEn": "High availability", "aEs": "Alta disponibilidad"}, {"en": "Ensure users always have the best experience by deploying apps to all regions where there are users", "es": "Asegurar la mejor experiencia desplegando aplicaciones en todas las regiones donde hay usuarios", "aEn": "Geo-distribution", "aEs": "Distribución geográfica"}], "pool": ["Disaster recovery", "Geo-distribution", "High availability", "Scalability"], "why": "Cada beneficio se asocia con una descripción distinta.", "exp": ["Escalabilidad: aumentar la capacidad.", "Alta disponibilidad: experiencia continua sin caídas.", "Distribución geográfica: desplegar en las regiones donde hay usuarios."]}, {"n": 95, "kind": "mc", "qEn": "Which cloud computing benefit provides continuous user access to a cloud-based application with minimal downtime?", "qEs": "¿Qué beneficio de la nube ofrece acceso continuo a una aplicación en la nube con un tiempo de inactividad mínimo?", "oEn": ["agility", "scalability", "elasticity", "high availability"], "oEs": ["agilidad", "escalabilidad", "elasticidad", "alta disponibilidad"], "ans": [3], "why": "Alta disponibilidad = servicio casi siempre activo.", "multi": false, "exp": ["Agilidad: lanzar rápido.", "Escalabilidad: aumentar capacidad.", "Elasticidad: ajustar a la demanda.", "Alta disponibilidad: acceso continuo con mínimo tiempo de inactividad. Correcta."]}, {"n": 96, "kind": "mc", "qEn": "You need to identify the type of failure for which an Azure Availability Zone can be used to protect access to Azure services.\nWhat should you identify?", "qEs": "Debes identificar contra qué tipo de fallo se puede usar una zona de disponibilidad (Availability Zone) de Azure para proteger el acceso a los servicios. ¿Qué identificas?", "oEn": ["a physical server failure", "an Azure region failure", "a storage failure", "an Azure data center failure"], "oEs": ["un fallo de un servidor físico", "un fallo de una región de Azure", "un fallo de almacenamiento", "un fallo de un centro de datos de Azure"], "ans": [3], "why": "Las zonas son centros de datos separados dentro de una región; protegen ante la caída de uno de ellos.", "multi": false, "exp": ["Fallo de un servidor: se cubre con un conjunto de disponibilidad.", "Fallo de región: se cubre con varias regiones.", "Fallo de almacenamiento: no es lo que cubren las zonas.", "Fallo de un centro de datos: las zonas son centros de datos separados. Correcta."]}, {"n": 97, "kind": "mc", "qEn": "You plan to extend your company's network to Azure. The network contains a VPN appliance that uses the IP address 131.107.200.1. You need to create an Azure resource that defines the VPN appliance in Azure. Which Azure resource should you create?", "qEs": "Planeas extender la red de tu empresa a Azure. La red contiene un dispositivo VPN con la dirección IP 131.107.200.1. Debes crear un recurso de Azure que defina ese dispositivo VPN en Azure. ¿Qué recurso creas?", "oEn": ["NAT gateways", "Application gateways", "Local network gateways", "Virtual network gateways", "On-premises Data Gateways", "Azure Data Box Gateway", "Azure Stack Edge / Data Box Gateway", "Web Application Firewall policies"], "oEs": ["NAT gateways", "Application gateways", "Local network gateways (puertas de enlace de red local)", "Virtual network gateways", "On-premises Data Gateways", "Azure Data Box Gateway", "Azure Stack Edge / Data Box Gateway", "Web Application Firewall policies"], "ans": [2], "why": "La local network gateway representa tu VPN local (con su IP) dentro de Azure.", "multi": false, "exp": ["NAT gateway: da salida a Internet a una subred.", "Application Gateway: balanceador web.", "Local network gateway: representa tu VPN local (con su IP) en Azure. Correcta.", "Virtual network gateway: es el extremo en Azure, no el dispositivo local.", "On-premises Data Gateway: conecta datos locales con servicios como Power BI.", "Data Box Gateway: transfiere datos.", "Stack Edge: dispositivo de borde.", "WAF: protege aplicaciones web."]}, {"n": 98, "kind": "mc", "qEn": "You plan to deploy several Azure virtual machines.\nYou need to ensure that the services running on the virtual machines are available if a single data center fails.\nSolution: You deploy the virtual machines to two or more resource groups.\nDoes this meet the goal?", "qEs": "Planeas desplegar varias máquinas virtuales de Azure. Debes asegurarte de que los servicios que se ejecutan en ellas sigan disponibles si falla un único centro de datos.\nSolución: Despliegas las máquinas virtuales en dos o más grupos de recursos.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Los grupos de recursos son solo organización lógica, no protegen ante fallos físicos.", "multi": false, "exp": ["Sí: los grupos de recursos son solo organización lógica, no protegen ante fallos físicos.", "No: no garantizan disponibilidad."]}, {"n": 99, "kind": "mc", "qEn": "You plan to deploy several Azure virtual machines.\nYou need to ensure that the services running on the virtual machines are available if a single data center fails.\nSolution: You deploy the virtual machines to a scale set.\nDoes this meet the goal?", "qEs": "Planeas desplegar varias máquinas virtuales de Azure. Debes asegurarte de que los servicios que se ejecutan en ellas sigan disponibles si falla un único centro de datos.\nSolución: Despliegas las máquinas virtuales en un conjunto de escalado (scale set).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "⚠ Discutida: un scale set puede repartirse en zonas de disponibilidad, así que algunos la dan por Sí. La clave dice No. Confírmala con tu profe.", "multi": false, "disputed": true, "exp": ["Sí: algunos lo dan por válido porque un scale set puede repartirse en zonas, pero la clave dice No (discutida).", "No: es la respuesta de la clave."]}, {"n": 100, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "An Azure subscription can be associated to multiple Azure Active Directory (Azure AD) tenants.", "es": "Una suscripción de Azure puede estar asociada a varios inquilinos (tenan pos de recursos organizan recursos dentro de una suscripción.", "Grupos de administración: agrupan varias suscripciones y aplican gobierno y cumplimiento sobre todas. Correcta.", "Directivas: definen reglas, pero no agrupan suscripciones.", "Planes de App Service: definen recursos de cómputo."]}, {"n": 102, "kind": "mc", "qEn": "Your company plans to migrate to Azure.\nThe company has several departments. All the Azure resources used by each department will be managed by a department administrator.\nWhat are two possible techniques to segment Azure for the departments? Each correct answer presents a complete solution.", "qEs": "Tu empresa planea migrar a Azure. Tiene varios departamentos. Todos los recursos de Azure de cada departamento los gestionará un administrador del departamento. ¿Cuáles son dos técnicas posibles para segmentar Azure por departamentos? Cada respuesta correcta presenta una solución completa.", "oEn": ["multiple subscriptions", "multiple Azure Active Directory (Azure AD) directories", "multiple regions", "multiple resource groups"], "oEs": ["varias suscripciones", "varios directorios de Azure Active Directory (Azure AD)", "varias regiones", "varios grupos de recursos"], "ans": [0, 3], "why": "Suscripciones y grupos de recursos son las formas habituales de segmentar.", "multi": true, "exp": ["Varias suscripciones: segmentan costes y administración por departamento. Correcta.", "Varios directorios de Azure AD: segmentan identidades, no recursos y complican la administración.", "Varias regiones: segmentan por ubicación, no por departamento.", "Varios grupos de recursos: permiten delegar la administración por departamento. Correcta."]}, {"n": 103, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "A single Microsoft account can be used to manage multiple Azure subscriptions.", "es": "Una sola cuenta de Micro const TOT=DATA.length;
const L='ABCDEFGH';
const KEY='az900-done-v1';
let done=new Set();

const st={lang:'both',range:'all',kind:'all',q:'',pend:false,open:new Set(),allOpen:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND={mc:'Elegir opción',yn:'Sí / No',match:'Relacionar'};
function side(d,lang,show){
  const es=lang==='es', q=es?d.qEs:d.qEn;
  let h=`<div class="col ${lang}"><div class="lang">${es?'ESPAÑOL':'ENGLISH'}</div><p class="q">${esc(q)}</p>`;
  if(d.kind==='mc'){
    const o=es?d.oEs:d.oEn;
    h+='<ul class="opts">'+o.map((t,i)=>`<li class="${show&&d.ans.includes(i)?'right':''}"><b>${L[i]}.</b><span>${esc(t)}</span></li>`).join('')+'</ul>';
    if(show) h+=`<p class="pool"><b>${es?'Respuesta':'Answer'}:</b> ${d.ans.map(i=>L[i]).join(', ')}</p>`;
  }else if(d.kind==='yn'){
    h+='<div class="rows">'+d.rows.map(r=>{
      const t=es?r.es:r.en, a=r.yes?(es?'Sí':'Yes'):'No';
      return `<div class="row"><span class="t">${esc(t)}</span>${show?`<span class="pill ${r.yes?'y':'n'}">${a}</span>`:`<span class="pill">${es?'Sí / No':'Yes / No'}</span>`}</div>`}).join('')+'</div>';
  }else{
    h+='<div class="rows">'+d.rows.map(r=>{
      const t=es?r.es:r.en, a=es?r.aEs:r.aEn;
      return `<div class="row"><span class="t">${esc(t)}</span>${show?`<span class="pill m">${esc(a)}</span>`:'<span class="pill">?</span>'}</div>`}).join('')+'</div>';
    h+=`<p class="pool">${es?'Opciones':'Options'}: ${esc(d.pool.join(' · '))}</p>`;
  }
  return h+'</div>';
}
function expl(d){
  if(!d.exp)return '';
  let labels;
  if(d.kind==='mc')labels=d.oEs.map((x,i)=>({t:x,ok:d.ans.includes(i)}));
  else if(d.kind==='yn')labels=d.rows.map(r=>({t:r.es,ok:null,yes:r.yes}));
  else labels=d.rows.map(r=>({t:r.es,ok:null,a:r.aEs}));
  const li=labels.map((l,i)=>{
    const mark=l.ok===true?'✔':l.ok===false?'✘':'•';
    const cls=l.ok===true?'eok':l.ok===false?'eno':'';
    const ans=d.kind==='yn'?` <i>(${l.yes?'Sí':'No'})</i>`:d.kind==='match'?` <i>(→ ${esc(l.a)})</i>`:'';
    return `<li class="${cls}"><span class="em">${mark}</span><div><b>${esc(l.t)}</b>${ans}<br>${esc(d.exp[i])}</div></li>`}).join('');
  return `<div class="expl"><b>Explicación detallada</b><ul>${li}</ul></div>`;
}
function card(d){
  const show=st.allOpen||st.open.has(d.n);
  const cols=st.lang==='both'?'cols':'cols one';
  const sides=(st.lang!=='en'?side(d,'es',show):'')+(st.lang!=='es'?side(d,'en',show):'');
  return `<article class="card" id="p${d.n}" data-n="${d.n}"><div class="top"><span class="num">P${d.n}</span><span class="tag">${KIND[d.kind]}${d.multi?' · varias respuestas':''}${d.disputed?' · respuesta discutida':''}</span><label class="done"><input type="checkbox" data-done="${d.n}" ${done.has(d.n)?'checked':''}> Estudiada</label></div><div class="${cols}">${sides}</div><div class="foot"><button class="show" data-show="${d.n}" aria-expanded="${show}">${show?'Ocultar respuesta':'Ver respuesta'}</button>${show?`<div class="why"><b>Por qué:</b> ${esc(d.why)}</div>`:''}</div>${show?expl(d):''}</article>`;
}
function text(d){return [d.qEn,d.qEs,...(d.oEn||[]),...(d.oEs||[]),...(d.rows||[]).flatMap(r=>[r.en,r.es,r.aEn||'',r.aEs||''])].join(' ').toLowerCase()}
const IDX=DATA.map(d=>[d,text(d)]);
function render(){
  const q=st.q.trim().toLowerCase();
  const list=IDX.filter(([d,t])=>{
    if(st.range!=='all'){const [a,b]=st.range.split('-').map(Number);if(d.n<a||d.n>b)return false}
    if(st.kind!=='all'&&d.kind!==st.kind)return false;
    if(st.pend&&done.has(d.n))return false;
    if(q&&!t.includes(q))return false;
    return true}).map(x=>x[0]);
  $('#list').innerHTML=list.length?list.map(card).join(''):'<p class="empty">Ninguna pregunta coincide con el filtro.</p>';
  $('#stat').textContent=`${list.length} mostradas · ${done.size}/${TOT} estudiadas`;
  $('#all').textContent=st.allOpen?'Ocultar todas las respuestas':'Ver todas las respuestas';
}
const rs=$('#range');
rs.innerHTML=`<option value="all">Todas (1–${TOT})</option>`+[...Array(Math.ceil(TOT/10))].map((_,i)=>`<option value="${i*10+1}-${i*10+10}">${i*10+1}–${i*10+10}</option>`).join('');
$('#langseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.lang=b.dataset.l;document.querySelectorAll('#langseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
rs.addEventListener('change',()=>{st.range=rs.value;render()});
$('#kind').addEventListener('change',e=>{st.kind=e.target.value;render()});
$('#q').addEventListener('input',e=>{st.q=e.target.value;render()});
$('#all').addEventListener('click',()=>{st.allOpen=!st.allOpen;st.open.clear();render()});
$('#pend').addEventListener('click',e=>{st.pend=!st.pend;e.currentTarget.setAttribute('aria-pressed',st.pend);e.currentTarget.textContent=st.pend?'Mostrar todas':'Solo pendientes';render()});
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-show]');
  if(b){const n=+b.dataset.show;if(st.allOpen){st.allOpen=false;DATA.forEach(d=>st.open.add(d.n));}
    st.open.has(n)?st.open.delete(n):st.open.add(n);
    const el=document.getElementById('p'+n);const d=DATA[n-1];el.outerHTML=card(d);$('#all').textContent='Ver todas las respuestas';}
});
$('#list').addEventListener('change',e=>{
  const c=e.target.closest('[data-done]');if(!c)return;
  const n=+c.dataset.done;c.checked?done.add(n):done.delete(n);save();
  $('#stat').textContent=$('#stat').textContent.replace(/\d+\/\d+ estudiadas/,done.size+'/'+TOT+' estudiadas');
  if(st.pend)render();
});

  clearInterval(T.timer);
  tv.innerHTML=`<div class="card"><h2 class="h2">Simulador de test</h2><p class="pool" style="margin:0">Preguntas al azar de las ${TOT}. Elige tu respuesta y pulsa «Comprobar». Al final verás tu nota (aprobado a partir del 70 %) y las que fallaste.</p>
  <div class="setup"><label for="tn">Preguntas<select id="tn">${[...new Set([10,20,40,60,100,TOT])].filter(n=>n<=TOT).map(n=>`<option ${n===20?'selected':''}>${n}</option>`).join('')}</select></label>
  <label for="ts">Origen<select id="ts"><option value="all">Todas</option><option value="wrong">Solo falladas (${wrong.size})</option><option value="new">Solo no estudiadas (${TOT-done.size})</option></select></label>
  <label for="tl">Idioma<select id="tl"><option value="both">ES + EN</option><option value="es">Solo ES</option><option value="en">Solo EN</option></select></label>
  <label class="chk" for="te"><input type="checkbox" id="te"> Modo examen (corrección al final)</label></div>
  ${msg?`<p class="why" style="margin:0 0 12px">${msg}</p>`:''}<div class="foot"><button class="show" id="tgo">Empezar test</button></div></div>`;
  $('#tl').value=st.lang;
}
function tside(d,lang,inter){
  const es=lang==='es',q=es?d.qEs:d.qEn;
  let h=`<div class="col ${lang}"><div class="lang">${es?'ESPAÑOL':'ENGLISH'}</div><p class="q">${esc(q)}</p>`;
  if(d.kind==='mc'){
    const o=es?d.oEs:d.oEn,type=d.multi?'checkbox':'radio';
    h+='<div class="opts2">'+o.map((x,i)=>inter?`<label class="opt"><input type="${type}" name="o" value="${i}"><b>${L[i]}.</b><span>${esc(x)}</span></label>`:`<div class="opt"><b>${L[i]}.</b><span>${esc(x)}</span></div>`).join('')+'</div>';
  }else if(d.kind==='yn'){
    h+='<div class="rows">'+d.rows.map((r,j)=>`<div class="row"><span class="t">${esc(es?r.es:r.en)}</span>${inter?`<span class="yn"><label><input type="radio" name="r${j}" value="1"> ${es?'Sí':'Yes'}</label><label><input type="radio" name="r${j}" value="0"> No</label></span>`:''}</div>`).join('')+'</div>';
  }else{
    h+='<div class="rows">'+d.rows.map((r,j)=>`<div class="row"><span class="t">${esc(es?r.es:r.en)}</span>${inter?`<select name="m${j}" aria-label="Respuesta ${j+1}"><option value="">—</option>${d.pool.map((p,k)=>`<option value="${k}">${esc(pl(p))}</option>`).join('')}</select>`:''}</div>`).join('')+'</div>';
  }
  return h+'</div>';
}
function tick(){const c=$('#clock');if(!c)return;const s=Math.floor((Date.now()-T.t0)/1000);c.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function showQ(){
  const d=T.q[T.i];T.checked=false;
  const lang=st.lang,first=lang==='en'?'en':'es';
  const last=T.i+1>=T.q.length;
  tv.innerHTML=`<div class="card"><div class="top"><span class="num">${T.i+1} / ${T.q.length}</span><span class="tag">P${d.n} · ${KIND[d.kind]}${d.multi?` · elige ${d.ans.length}`:''}</span><span class="stat" id="clock" style="margin-left:auto;width:auto">00:00</span></div><div class="prog"><i style="width:${T.i/T.q.length*100}%"></i></div><div class="${lang==='both'?'cols':'cols one'}" id="tcols">${(lang!=='en'?tside(d,'es',first==='es'):'')+(lang!=='es'?tside(d,'en',first==='en'):'')}</div><div id="fb"></div><div class="foot"><button class="show" id="tcheck">${T.exam?(last?'Terminar':'Siguiente'):'Comprobar'}</button><button class="btn" id="tquit">Salir</button></div></div>`;
  tick();window.scrollTo({top:0});
}
function getAns(d){
  if(d.kind==='mc')return [...tv.querySelectorAll('input[name=o]:checked')].map(x=>+x.value).sort((a,b)=>a-b);
  if(d.kind==='yn')return d.rows.map((r,j)=>{const c=tv.querySelector(`input[name=r${j}]:checked`);return c?c.value==='1':null});
  return d.rows.map((r,j)=>{const v=tv.querySelector(`select[name=m${j}]`).value;return v===''?null:d.pool[+v]});
}
function isRight(d,a){
  if(d.kind==='mc'){const c=[...d.ans].sort((x,y)=>x-y);return a.length===c.length&&a.every((x,i)=>x===c[i])}
  if(d.kind==='yn')return a.every((x,j)=>x===d.rows[j].yes);
  return a.every((x,j)=>x===d.rows[j].aEn);
}
function answerCols(d){
  const lang=st.lang;
  return `<div class="${lang==='both'?'cols':'cols one'}">${(lang!=='en'?side(d,'es',true):'')+(lang!=='es'?side(d,'en',true):'')}</div>`;
}
function next(){T.i++;if(T.i>=T.q.length)finish();else showQ()}
function finish(){
  clearInterval(T.timer);
  const N=T.q.length,ok=T.res.filter(r=>r.ok).length,pct=Math.round(ok/N*100),pass=pct>=70;
  T.res.forEach(r=>{r.ok?wrong.delete(r.d.n):wrong.add(r.d.n)});saveW();
  const bad=T.res.filter(r=>!r.ok);
  const secs=Math.floor((Date.now()-T.t0)/1000);
  tv.innerHTML=`<div class="card"><div class="top"><span class="tag">Resultado</span></div><div class="score ${pass?'pass':'fail'}">${pct} %</div><p style="margin:8px 0 0"><b>${pass?'Aprobado':'Suspenso'}</b> · ${ok} de ${N} correctas · ${Math.floor(secs/60)} min ${secs%60} s · el aprobado está en el 70 %.</p>
  <div class="foot"><button class="show" id="tnew">Nuevo test</button>${bad.length?`<button class="btn" id="tretry">Repetir las ${bad.length} falladas</button>`:''}</div></div>`+
  (bad.length?`<h2 class="h2" style="margin-top:20px">Preguntas falladas</h2>`+bad.map(r=>`<article class="card"><div class="top"><span class="num">P${r.d.n}</span><span class="tag">${KIND[r.d.kind]}</span></div>${answerCols(r.d)}<div class="foot"><div class="why"><b>Por qué:</b> ${esc(r.d.why)}</div></div>${expl(r.d)}</article>`).join(''):'<p class="empty">¡Sin fallos! Muy bien.</p>');
  window.scrollTo({top:0});
}
function begin(pool){
  T.q=pool;T.i=0;T.res=[];T.t0=Date.now();
  clearInterval(T.timer);T.timer=setInterval(tick,1000);showQ();
}
tv.addEventListener('click',e=>{
  const id=(e.target.closest('button')||{}).id;
  if(!id)return;
  if(id==='tgo'){
    const src=$('#ts').value;
    let pool=DATA.filter(d=>src==='all'||(src==='wrong'&&wrong.has(d.n))||(src==='new'&&!done.has(d.n)));
    if(!pool.length){setup(src==='wrong'?'Todavía no tienes preguntas falladas. Haz primero un test con «Todas».':'No hay preguntas para ese origen.');return}
    setLang($('#tl').value);T.exam=$('#te').checked;
    begin(shuffle(pool).slice(0,Math.min(+$('#tn').value,pool.length)));
  }else if(id==='tcheck'){
    const d=T.q[T.i];
    if(T.checked){next();return}
    const a=getAns(d),ok=isRight(d,a);
    T.res[T.i]={d,a,ok};
    if(T.exam){next();return}
    T.checked=true;
    $('#tcols').outerHTML=answerCols(d);
    $('#fb').innerHTML=`<div class="why ${ok?'':'bad'}" style="margin-top:12px"><b>${ok?'✔ Correcto':'✘ Incorrecto'}</b> · ${esc(d.why)}</div>${expl(d)}`;
    $('#tcheck').textContent=T.i+1>=T.q.length?'Ver resultado':'Siguiente';
  }else if(id==='tquit'){clearInterval(T.timer);setup()}
  else if(id==='tnew'){setup()}
  else if(id==='tretry'){begin(shuffle(T.res.filter(r=>!r.ok).map(r=>r.d)))}
});
$('#modeseg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#modeseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  const t=b.dataset.m==='test';
  $('#study').hidden=t;tv.hidden=!t;
  if(t&&!tv.innerHTML.trim())setup();
});
render();
</script>

</body></html>
